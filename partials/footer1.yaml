- rtgl-view h="1" w="f" bgc="bo":
- 'rtgl-view g="lg" md-w="calc(100vw - 32px)" xl-w="calc(100vw - 64px)" w="1200"':
    - rtgl-view h=48:
    - rtgl-view md-d=v d=h w=f md-g=xl:
        - rtgl-view g="xl" md-w=f w="1fg" ah="s":
            - 'a href="/" style="display: contents"':
                - rtgl-view d=h av=c g=md:
                    - 'rtgl-image h="${site.footer.logo.height}" w="${site.footer.logo.width}" src="${site.footer.logo.src}" alt="${site.footer.logo.alt}"':
                    - $if site.footer.logo.label:
                        - rtgl-text s="lg": ${site.footer.logo.label}
            - 'rtgl-view style="display: grid; grid-template-columns: repeat(4, 20px); gap: 16px; align-items: center;"':
                - $for social in site.footer.social:
                    - 'a href="${social.href}" target="_blank" rel="noreferrer" aria-label="Visit our ${social.name} page" style="display: contents"':
                        - 'rtgl-svg cur="p" f="se-fg" svg="${social.svg}" wh="20"':
        - rtgl-view md-d=v d="h" md-w=f w="2fg" md-g=lg g="xl":
            - $for column in site.footer.columns:
                - rtgl-view d="h" md-w=f w="1fg" md-ah=s ah="c":
                    - rtgl-view g="lg":
                        - $for link in column.links:
                            - rtgl-text s="sm" c="ac-fg":
                                - 'a href="${link.href}"':
                                    - "${link.text}"
    - rtgl-view h=48:
