- rtgl-view bwb=xs w=f ah=c pos=fix bgc=bg:
    - 'rtgl-view md-w="calc(100vw - 32px)" xl-w="calc(100vw - 64px)" w="1200" d=h av=c h=64':
        - 'a href="${title.href}" style="text-decoration: none; color: inherit;"':
            - rtgl-view d=h av=c g=md:
                - $if title.imgSrc:
                    - rtgl-image h="${title.imgHeight}" w="${title.imgWidth}" src="${title.imgSrc}":
                - $if title.label:
                    - rtgl-text: ${title.label}
        - rtgl-view w="1fg":
        - rtgl-view d=h av=c g=md:
            - $if secondaryCta.label:
                - 'rtgl-button href="${secondaryCta.href}" v="se"': ${secondaryCta.label}
            - $if cta.label:
                - rtgl-button href="${cta.href}": ${cta.label}
