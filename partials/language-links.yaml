- 'nav aria-label="Languages" style="display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; padding: 32px 16px;"':
    - $for link in links:
        - 'a href="${link.href}" hreflang="${link.hreflang}" style="color: inherit; opacity: 0.7; font-size: 14px; text-decoration: underline; text-underline-offset: 2px;"': ${link.label}
