- rtgl-view ah="c" ph="lg" md-w="100vw" lg-w="768" w="1024":
    - rtgl-view ah="c" p="xl" br="md" bw="sm" w="f":
        - $if imgSrc:
            - 'rtgl-image h="56" w="56" src="${imgSrc}" alt="" mb="md"':
          $else:
            - $if svg:
                - rtgl-svg svg="${svg}" wh="48" f="pr" mb="md":
        - rtgl-text s="h2" mb="md" c="pr" ta="c": ${title}
        - rtgl-text s="lg" c="pr" mb="lg" ta="c": ${subtitle}
        - rtgl-view d="h" g="md" ah="c":
            - $if cta.variant == "se":
                - $if cta.newTab:
                    - 'rtgl-button href="${cta.href}" v="se" new-tab': ${cta.label}
                  $else:
                    - 'rtgl-button href="${cta.href}" v="se"': ${cta.label}
              $else:
                - $if cta.newTab:
                    - rtgl-button href="${cta.href}" new-tab: ${cta.label}
                  $else:
                    - rtgl-button href="${cta.href}": ${cta.label}
            - $if secondaryCta:
                - $if secondaryCta.variant == "pr":
                    - $if secondaryCta.newTab:
                        - rtgl-button href="${secondaryCta.href}" new-tab: ${secondaryCta.label}
                      $else:
                        - rtgl-button href="${secondaryCta.href}": ${secondaryCta.label}
                  $else:
                    - $if secondaryCta.newTab:
                        - 'rtgl-button href="${secondaryCta.href}" v="se" new-tab': ${secondaryCta.label}
                      $else:
                        - 'rtgl-button href="${secondaryCta.href}" v="se"': ${secondaryCta.label}
