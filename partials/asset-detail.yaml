- style: |
    .rvn-asset-detail {
      --rvn-detail-panel: #1f1f1f;
      --rvn-detail-panel-soft: #252525;
      --rvn-detail-border: rgba(255, 255, 255, 0.12);
      --rvn-detail-muted: rgba(255, 255, 255, 0.68);
      box-sizing: border-box;
      display: grid;
      gap: 24px;
      margin: 56px auto 0;
      max-width: 1200px;
      width: 1200px !important;
    }

    .rvn-asset-detail *,
    .rvn-asset-detail *::before,
    .rvn-asset-detail *::after {
      box-sizing: border-box;
    }

    .rvn-detail-back {
      color: var(--rvn-detail-muted);
      font-size: 0.92rem;
      text-decoration: none;
      width: fit-content;
    }

    .rvn-detail-back:hover {
      color: var(--foreground);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .rvn-detail-header {
      align-items: start;
      display: grid;
      gap: 24px 18px;
      grid-template-columns: minmax(0, 1fr) 280px;
      min-width: 0;
      width: 100% !important;
    }

    .rvn-detail-heading {
      grid-column: 1;
      grid-row: 1;
    }

    .rvn-detail-title {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.1;
      margin: 0;
    }

    .rvn-detail-subtitle,
    .rvn-detail-muted {
      color: var(--rvn-detail-muted);
    }

    .rvn-detail-preview {
      aspect-ratio: 16 / 9;
      background: #111;
      border: 1px solid var(--rvn-detail-border);
      border-radius: 8px;
      grid-column: 1;
      grid-row: 2;
      overflow: hidden;
      width: 100%;
    }

    .rvn-detail-preview-video,
    .rvn-detail-preview-image {
      display: block;
      filter: saturate(0.95) var(--thumb-filter, none);
      height: 100%;
      object-fit: cover;
      transform: scale(1.01);
      width: 100%;
    }

    .rvn-detail-section-title {
      color: var(--foreground);
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
      margin: 0;
    }

    .rvn-detail-aside {
      align-self: start;
      display: grid;
      gap: 16px;
      grid-column: 2;
      grid-row: 2;
      padding: 0;
      position: sticky;
      top: 88px;
    }

    .rvn-detail-meta-list {
      display: grid;
      gap: 12px;
    }

    .rvn-detail-meta-row {
      border-top: 1px solid var(--rvn-detail-border);
      display: grid;
      gap: 4px;
      padding-top: 12px;
    }

    .rvn-detail-meta-row:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .rvn-detail-meta-label {
      color: var(--rvn-detail-muted);
      font-size: 0.78rem;
      line-height: 1.2;
    }

    .rvn-detail-meta-value {
      color: var(--foreground);
      font-size: 0.94rem;
      line-height: 1.3;
    }

    .rvn-detail-pack-link {
      color: var(--foreground);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (max-width: 1280px) {
      .rvn-asset-detail {
        max-width: calc(100vw - 64px);
        width: calc(100vw - 64px) !important;
      }
    }

    @media (max-width: 980px) {
      .rvn-detail-header {
        grid-template-columns: 1fr;
      }

      .rvn-detail-aside {
        grid-column: 1;
        grid-row: 3;
        position: static;
      }
    }

    @media (max-width: 760px) {
      .rvn-asset-detail {
        max-width: calc(100vw - 48px);
        width: calc(100vw - 48px) !important;
      }

      .rvn-detail-header {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      .rvn-asset-detail {
        margin-top: 40px;
      }

    }

- 'main class="rvn-asset-detail"':
    - 'a class="rvn-detail-back" href="${backHref}"': Back
    - 'header class="rvn-detail-header"':
        - 'rtgl-view class="rvn-detail-preview" style="--thumb-filter: ${thumbFilter};"':
            - $if videoSrc:
                - $if videoLoopDelayMs:
                    - 'video class="rvn-detail-preview-video" src="${videoSrc}" data-loop-delay="${videoLoopDelayMs}" autoplay muted playsinline preload="metadata"':
                  $else:
                    - 'video class="rvn-detail-preview-video" src="${videoSrc}" autoplay muted loop playsinline preload="metadata"':
            - $if imageSrc:
                - 'img class="rvn-detail-preview-image" src="${imageSrc}" alt="${imageAlt}"':
        - 'rtgl-view class="rvn-detail-heading" g="md"':
            - 'h1 class="rvn-detail-title"': ${assetTitle}
            - rtgl-text class="rvn-detail-subtitle" s="md": ${assetSubtitle}
        - 'aside class="rvn-detail-aside" aria-label="Asset information"':
            - 'h2 class="rvn-detail-section-title"': Asset info
            - rtgl-view class="rvn-detail-meta-list":
                - rtgl-view class="rvn-detail-meta-row":
                    - rtgl-text class="rvn-detail-meta-label": Asset pack
                    - 'a class="rvn-detail-pack-link" href="${backHref}"': Transitions
                - rtgl-view class="rvn-detail-meta-row":
                    - rtgl-text class="rvn-detail-meta-label": Format
                    - rtgl-text class="rvn-detail-meta-value": ${assetFormat}
                - rtgl-view class="rvn-detail-meta-row":
                    - rtgl-text class="rvn-detail-meta-label": Resolution
                    - rtgl-text class="rvn-detail-meta-value": 1920 × 1080
- script: |
    (() => {
      document.querySelectorAll(".rvn-detail-preview-video[data-loop-delay]").forEach((video) => {
        const delay = Number(video.dataset.loopDelay);

        if (!Number.isFinite(delay) || delay < 0) {
          return;
        }

        video.addEventListener("ended", () => {
          window.setTimeout(() => {
            video.currentTime = 0;
            const playPromise = video.play();

            if (playPromise) {
              playPromise.catch(() => {});
            }
          }, delay);
        });
      });
    })();
