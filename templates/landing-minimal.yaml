- html lang="en":
    - head:
        - $partial: seo1
          page: ${page}
          seo: ${seo}
        - style: |
            html,
            body {
              margin: 0;
              min-height: 100%;
              background: #000;
              -webkit-tap-highlight-color: transparent;
              -webkit-touch-callout: none;
              user-select: none;
            }
            ::selection {
              background: transparent;
            }
            body {
              min-height: 100vh;
              overflow: hidden;
            }
            .landing-shell {
              box-sizing: border-box;
              display: grid;
              isolation: isolate;
              min-height: 100vh;
              padding: 24px;
              place-items: center;
              position: relative;
            }
            .landing-shell::before {
              background: #fff;
              bottom: 0;
              clip-path: polygon(100% 0, 0 100%, 100% 100%);
              content: "";
              height: min(28vh, 300px);
              pointer-events: none;
              position: fixed;
              right: 0;
              width: min(38vw, 520px);
              z-index: 0;
            }
            .landing-link {
              align-items: flex-start;
              color: inherit;
              --landing-stage-width: min(64vw, 720px, calc(90vh * 1440 / 1532));
              display: grid;
              grid-template-columns: minmax(0, 1fr) var(--landing-stage-width) minmax(0, 1fr);
              line-height: normal;
              text-decoration: none;
              -webkit-touch-callout: none;
              position: relative;
              width: 100%;
              z-index: 1;
            }
            .landing-stage {
              aspect-ratio: 1440 / 1532;
              grid-column: 2;
              position: relative;
              width: var(--landing-stage-width);
            }
            .landing-layer {
              display: block;
              inset: 0;
              height: auto;
              position: absolute;
              -webkit-touch-callout: none;
              -webkit-user-drag: none;
              transform: translate3d(0, 0, 0);
              user-drag: none;
              width: 100%;
              will-change: transform;
            }
            .landing-layer-back {
              z-index: 1;
            }
            .landing-layer-character {
              z-index: 2;
            }
            .landing-layer-front {
              z-index: 3;
            }
            .landing-copy {
              color: #fff;
              display: grid;
              gap: 10px;
              grid-column: 1;
              justify-self: end;
              line-height: 1.2;
              margin-top: 0;
              margin-right: clamp(16px, 4vw, 56px);
              pointer-events: none;
              text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
              transform: translateY(clamp(-64px, -5vh, -36px));
              width: max-content;
            }
            .landing-brand {
              align-items: center;
              display: flex;
              gap: 10px;
            }
            .landing-brand-icon {
              display: block;
              height: 28px;
              width: 28px;
            }
            .landing-brand-name {
              font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              font-size: clamp(18px, 3vw, 24px);
              font-weight: 700;
              letter-spacing: 0;
            }
            .landing-tagline {
              font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              font-size: clamp(24px, 2.6vw, 32px);
              font-weight: 400;
              margin: 0;
              white-space: nowrap;
            }
            @media (orientation: landscape) {
              .landing-shell::before {
                height: min(76vh, 720px);
                width: min(38vw, 680px);
              }
            }
            @media (max-width: 1800px) {
              .landing-link {
                align-items: flex-start;
                display: flex;
                flex-direction: column;
                gap: 18px;
                width: min(92vw, 720px);
              }
              .landing-stage {
                flex-basis: auto;
                width: min(92vw, 720px, calc(76vh * 1440 / 1532));
              }
              .landing-copy {
                margin-top: 0;
                margin-right: 0;
                text-align: left;
                transform: translateY(-44px);
              }
              .landing-brand {
                justify-content: flex-start;
              }
              .landing-tagline {
                font-size: clamp(20px, 6vw, 30px);
              }
            }
            @media (orientation: portrait) {
              .landing-brand-name {
                font-size: clamp(16px, 3.8vw, 20px);
              }
              .landing-tagline {
                font-size: clamp(18px, 4.8vw, 24px);
              }
            }
            .landing-particle-layer {
              inset: 0;
              overflow: hidden;
              pointer-events: none;
              position: fixed;
              z-index: 2;
            }
            .landing-particle {
              --dx: 0px;
              --dy: -16px;
              --size: 3px;
              --x: 0px;
              --y: 0px;
              animation: landing-particle-pop 820ms ease-out forwards;
              background: rgba(255, 255, 255, 0.88);
              border-radius: 9999px;
              box-shadow: 0 0 10px rgba(255, 255, 255, 0.52);
              height: var(--size);
              left: 0;
              opacity: 0;
              position: absolute;
              top: 0;
              transform: translate3d(var(--x), var(--y), 0) scale(0.35);
              width: var(--size);
            }
            .landing-particle[data-shape="star"] {
              border-radius: 0;
              clip-path: polygon(50% 0, 61% 36%, 100% 50%, 61% 64%, 50% 100%, 39% 64%, 0 50%, 39% 36%);
            }
            .landing-particle[data-tone="dark"] {
              background: rgba(0, 0, 0, 0.82);
              box-shadow: 0 0 10px rgba(0, 0, 0, 0.28);
            }
            @keyframes landing-particle-pop {
              12% {
                opacity: 0.9;
              }
              100% {
                opacity: 0;
                transform: translate3d(calc(var(--x) + var(--dx)), calc(var(--y) + var(--dy)), 0) scale(1);
              }
            }
            @media (prefers-reduced-motion: reduce) {
              .landing-layer {
                transform: none;
                transition: none;
                will-change: auto;
              }
              .landing-particle {
                animation: none;
                display: none;
              }
            }
    - body:
        - "${content}"
        - script: |
            (() => {
              document.addEventListener("contextmenu", (event) => {
                if (event.target.closest(".landing-stage")) {
                  event.preventDefault();
                }
              });
              document.addEventListener("dragstart", (event) => {
                if (event.target.closest(".landing-stage")) {
                  event.preventDefault();
                }
              });

              const elements = Array.from(document.querySelectorAll("[data-depth]"));
              const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

              if (!elements.length || reduceMotion.matches) {
                return;
              }

              const maxShift = 28;
              const idleShift = 18;
              const layers = elements.map((element) => ({
                element,
                depth: Number(element.dataset.depth) || 1,
                idle: Number(element.dataset.idle) || 1,
                phase: Number(element.dataset.phase) || 0,
                currentX: 0,
                currentY: 0,
              }));
              let pointerX = 0;
              let pointerY = 0;
              let frame = 0;
              let lastParticleAt = 0;
              let lastPointerClientX = null;
              let lastPointerClientY = null;
              let pointerInsideWindow = false;
              const particleLayer = document.createElement("div");
              particleLayer.className = "landing-particle-layer";
              document.body.appendChild(particleLayer);

              const isInWhiteWedge = (clientX, clientY) => {
                const shell = document.querySelector(".landing-shell");

                if (!shell) {
                  return false;
                }

                const wedgeStyle = window.getComputedStyle(shell, "::before");
                const wedgeWidth = Number.parseFloat(wedgeStyle.width);
                const wedgeHeight = Number.parseFloat(wedgeStyle.height);

                if (!Number.isFinite(wedgeWidth) || !Number.isFinite(wedgeHeight) || wedgeWidth <= 0 || wedgeHeight <= 0) {
                  return false;
                }

                const localX = clientX - (window.innerWidth - wedgeWidth);
                const localY = clientY - (window.innerHeight - wedgeHeight);

                if (localX < 0 || localX > wedgeWidth || localY < 0 || localY > wedgeHeight) {
                  return false;
                }

                return localX / wedgeWidth + localY / wedgeHeight >= 1;
              };

              const update = (time) => {
                const idleX = Math.sin(time * 0.00055) * idleShift + Math.sin(time * 0.00031) * 7;
                const idleY = Math.cos(time * 0.00042) * idleShift + Math.sin(time * 0.00028) * 7;

                layers.forEach((layer) => {
                  const layerIdleX = idleX * layer.idle + Math.sin(time * 0.00038 + layer.phase) * 5;
                  const layerIdleY = idleY * layer.idle + Math.cos(time * 0.00034 + layer.phase) * 5;
                  const targetX = pointerX * layer.depth + layerIdleX;
                  const targetY = pointerY * layer.depth + layerIdleY;

                  layer.currentX += (targetX - layer.currentX) * 0.08;
                  layer.currentY += (targetY - layer.currentY) * 0.08;

                  layer.element.style.transform = "translate3d(" + layer.currentX.toFixed(2) + "px, " + layer.currentY.toFixed(2) + "px, 0)";
                });

                frame = requestAnimationFrame(update);
              };

              const emitParticle = (clientX, clientY, isIdle = false) => {
                const particle = document.createElement("span");
                const size = (isIdle ? 2.5 : 3) + Math.random() * (isIdle ? 3.5 : 4);
                const driftX = (Math.random() - 0.5) * (isIdle ? 20 : 30);
                const driftY = -12 - Math.random() * (isIdle ? 20 : 28);

                particle.className = "landing-particle";
                particle.style.setProperty("--size", size.toFixed(2) + "px");
                particle.style.setProperty("--x", (clientX - size / 2).toFixed(2) + "px");
                particle.style.setProperty("--y", (clientY - size / 2).toFixed(2) + "px");
                particle.style.setProperty("--dx", driftX.toFixed(2) + "px");
                particle.style.setProperty("--dy", driftY.toFixed(2) + "px");

                if (Math.random() < 0.34) {
                  particle.dataset.shape = "star";
                }
                if (isInWhiteWedge(clientX, clientY)) {
                  particle.dataset.tone = "dark";
                }

                if (particleLayer.childElementCount > 44) {
                  particleLayer.firstElementChild.remove();
                }

                particleLayer.appendChild(particle);
                window.setTimeout(() => {
                  particle.remove();
                }, 860);
              };

              const setTargetFromPointer = (event) => {
                const x = (event.clientX / window.innerWidth - 0.5) * 2;
                const y = (event.clientY / window.innerHeight - 0.5) * 2;

                pointerX = x * maxShift;
                pointerY = y * maxShift;
                lastPointerClientX = event.clientX;
                lastPointerClientY = event.clientY;
                pointerInsideWindow = true;

                if (event.pointerType && event.pointerType !== "mouse") {
                  return;
                }

                const now = performance.now();
                if (now - lastParticleAt < 34) {
                  return;
                }

                lastParticleAt = now;
                emitParticle(event.clientX, event.clientY);
              };

              window.addEventListener("pointermove", setTargetFromPointer, { passive: true });
              window.addEventListener("mousemove", setTargetFromPointer, { passive: true });
              const resetPointer = () => {
                pointerX = 0;
                pointerY = 0;
                pointerInsideWindow = false;
              };
              window.addEventListener("pointerleave", resetPointer);
              document.addEventListener("mouseleave", resetPointer);

              const idleParticleTimer = window.setInterval(() => {
                if (!pointerInsideWindow || document.hidden || lastPointerClientX === null || lastPointerClientY === null) {
                  return;
                }

                emitParticle(lastPointerClientX, lastPointerClientY, true);
              }, 150);

              frame = requestAnimationFrame(update);

              reduceMotion.addEventListener("change", () => {
                cancelAnimationFrame(frame);
                window.clearInterval(idleParticleTimer);
                particleLayer.remove();
                layers.forEach((layer) => {
                  layer.element.style.removeProperty("transform");
                });
              }, { once: true });
            })();
