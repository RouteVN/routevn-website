- html lang="en":
    - head:
        - $partial: seo1
          page: ${page}
          seo: ${seo}
          publishedTime: ${date}
          modifiedTime: ${updatedAt}
        - link rel="stylesheet" href="/public/theme.css":
        - script src="https://cdn.jsdelivr.net/npm/@rettangoli/ui@1.21.0/dist/rettangoli-iife-ui.min.js":
        - script src="/public/rtgl-icons.js":
    - body.dark:
        - rtgl-view h="64":
        - rtgl-view w="f" ah="c":
            - rtgl-view d=h g=xl pb="lg" md-w="100vw" lg-w="768" w="1024" ph=lg:
                - rtgl-view id="content-container" lg-w="100%" w="624":
                    - h1: ${title}
                    - $if date:
                        - rtgl-text mb="xl" c="mu" s="sm":
                            - $partial: changelog-date
                              date: ${date}
                    - "${content}"
                - 'rtgl-view lg-hide w="1fg" style="position: sticky; top: 64px;"':
                    - rtgl-page-outline id="page-outline" target-id="content-container":
            - rtgl-view d="h" h="30vh":
            - $partial: footer1
        - rtgl-view pos="abs" edge="t" ah="c" bgc="mu":
            - $partial: navbar1
              title: ${site.navbar.title}
              cta: ${site.navbar.cta}
        - script: |
            (() => {
              if (window.__rvnPostOutlineScrollRelayInitialized) {
                return;
              }

              window.__rvnPostOutlineScrollRelayInitialized = true;

              let frame = null;

              const relayScrollToWindow = () => {
                if (frame !== null) {
                  return;
                }

                frame = window.requestAnimationFrame(() => {
                  frame = null;
                  window.dispatchEvent(new Event("scroll"));
                });
              };

              [
                document,
                document.scrollingElement,
                document.documentElement,
                document.body,
              ].forEach((scrollTarget, index, scrollTargets) => {
                if (!scrollTarget || scrollTargets.indexOf(scrollTarget) !== index) {
                  return;
                }

                scrollTarget.addEventListener("scroll", relayScrollToWindow, { passive: true });
              });
            })();

            (() => {
              // The page scrolls on <body>, so browsers skip fragment scrolling on
              // reload (history restores the window scroll, which stays 0).
              // Scroll to the hash target manually on initial load.
              if (window.__rvnPostHashScrollInitialized) {
                return;
              }

              window.__rvnPostHashScrollInitialized = true;

              const scrollToHash = () => {
                const hash = window.location.hash;

                if (!hash || hash.length < 2) {
                  return;
                }

                let target;

                try {
                  target = document.querySelector(hash);
                } catch (_error) {
                  return;
                }

                if (target) {
                  target.scrollIntoView();
                }
              };

              if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", () => {
                  window.requestAnimationFrame(() => window.requestAnimationFrame(scrollToHash));
                });
              } else {
                window.requestAnimationFrame(() => window.requestAnimationFrame(scrollToHash));
              }
            })();
