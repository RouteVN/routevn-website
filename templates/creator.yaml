- html lang="${default(lang, 'en')}":
    - head:
        - $partial: seo1
          page: ${page}
          seo: ${seo}
        - link rel="stylesheet" href="/public/theme.css":
        - script src="https://cdn.jsdelivr.net/npm/@rettangoli/ui@1.19.1/dist/rettangoli-iife-ui.min.js":
        - script src="/public/rtgl-icons.js":

    - body.dark:
        - rtgl-view w=f:
            - rtgl-view h="48":
            - rtgl-view w="f" ah="c":
                - rtgl-view w=f ph="lg" pb="lg" ah=c:
                    - "${content}"
                - rtgl-view d="h" h="${default(footerSpacerHeight, '20vh')}":
                - $partial: footer1
            - rtgl-view pos="abs" edge="t" ah="c" bgc="bg":
                - $partial: navbar1
                  title: ${site.navbar.title}
                  secondaryCta:
                    label: ${default(docsLabel, 'Docs')}
                    href: ${default(docsHref, '/en/creator/docs/introduction/')}
                  cta:
                    label: ${default(downloadLabel, 'Download')}
                    href: ${default(downloadHref, '/en/creator/download/')}
