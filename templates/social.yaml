- __html: "<!doctype html>"
- html lang="en":
    - head:
        - $partial: seo1
          alternates: ${alternates}
          page: ${page}
          seo: ${seo}
        - link rel="stylesheet" href="/public/theme.css":
        - script src="https://cdn.jsdelivr.net/npm/@rettangoli/ui@1.21.0/dist/rettangoli-iife-ui.min.js":
        - script src="/public/rtgl-icons.js":
    - body.dark:
        - rtgl-view w=f ah="c":
            - rtgl-view h="128":
            - 'rtgl-view w="f" ph="lg" pb="xl" ah="c" md-w="100vw"':
                - 'rtgl-view w="960" lg-w="calc(100vw - 64px)" md-w="calc(100vw - 48px)"':
                    - "${content}"
        - rtgl-view pos="abs" edge="t" ah="c" bgc="bg":
            - $partial: navbar1
              title: ${site.navbar.title}
              cta: ${site.navbar.cta}
