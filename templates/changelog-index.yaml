- __html: "<!doctype html>"
- html lang="en":
    - head:
        - $partial: seo1
          alternates: ${alternates}
          page: ${page}
          seo: ${seo}
        - link rel="stylesheet" href="/public/theme.css":
        - script src="https://cdn.jsdelivr.net/npm/@rettangoli/ui@1.21.0/dist/rettangoli-iife-ui.min.js":
        - script src="/public/rtgl-icons.js":
    - body.dark:
        - rtgl-view h="96":
        - rtgl-view w="f" ah="c":
            - rtgl-view md-w="100vw" lg-w="768" w="900" ph=lg pb="xl":
                - rtgl-view d=h md-d=v g=xl w=f mb="xl":
                    - rtgl-view md-w=f w="140" mt="sm":
                    - rtgl-view w="1fg" mb=xl:
                        - h1: ${changelog.title}
                - rtgl-view g="xl" w=f:
                    - $for item in sort(collections.changelog, "data.date", "desc"):
                        - rtgl-view d=h md-d=v g=xl w=f mb=xl:
                            - rtgl-view md-w=f w="140":
                                - rtgl-text c="mu" s="sm":
                                    - $partial: changelog-date
                                      date: ${item.data.date}
                            - rtgl-view class="changelog-release-content" w="1fg":
                                - 'a href="${item.url}" style="text-decoration: none; color: inherit;"':
                                    - h2: ${item.data.version}
                                - "${md(item.content, 'nested')}"
                                - $if item.data.videoSrc:
                                    - 'video src="${item.data.videoSrc}" controls playsinline preload="metadata" style="width: 100%; max-width: 100%; display: block; border: 1px solid var(--border); box-sizing: border-box; margin-bottom: 24px;"':
                                - $if item.data.videos:
                                    - $for video in item.data.videos:
                                        - $if video.title:
                                            - rtgl-text s="lg" mb="sm": ${video.title}
                                        - 'video src="${video.src}" controls playsinline preload="metadata" style="width: 100%; max-width: 100%; display: block; border: 1px solid var(--border); box-sizing: border-box; margin-bottom: 24px;"':
                                - $if item.data.images:
                                    - $if item.data.imagesTitle:
                                        - h3: ${item.data.imagesTitle}
                                    - $for image in item.data.images:
                                        - $if image.description:
                                            - rtgl-text mb="sm": ${image.description}
                                        - 'img src="${image.src}" alt="${image.alt}" style="width: 100%; max-width: 100%; height: auto; display: block; border: 1px solid var(--border); box-sizing: border-box; margin-bottom: 16px;"':
                                - $if item.data.isLatest:
                                    - 'a href="/en/creator/download/" style="text-decoration: none;"':
                                        - rtgl-button mt="md": Download
            - rtgl-view d="h" h="30vh":
            - $partial: footer1
        - rtgl-view pos="abs" edge="t" ah="c" bgc="bg":
            - $partial: navbar1
              title: ${site.navbar.title}
              cta: ${site.navbar.cta}
