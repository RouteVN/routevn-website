heading: The full potential of visual novels
intro:
  lead: Visual novels bring writing, art, sound, and interaction together in a uniquely expressive medium.
  body: We believe much of their potential remains unrealized. RouteVN exists to fulfill that potential.
sections:
  - title: Empowering creators
    paragraphs:
      - "We want RouteVN Creator to become the best tool for creating visual novels: approachable for new creators and powerful enough for professionals to choose for their most ambitious work."
      - We want it to unlock creative possibilities that would otherwise remain out of reach.
  - title: Connecting creators and readers
    audiences:
      - label: For creators
        text: We want creators to have an effective way to publish their work, reach the right readers, and retain greater creative freedom. They should be able to devote most of their effort to making the best visual novels they can and worry less about distribution.
      - label: For readers
        text: We want readers to easily discover a large, diverse library of high-quality visual novels from official sources, directly support the creators behind those works, and take part in discussions about the works they value.
  - title: Internationalization
    paragraphs:
      - Visual novels have long crossed borders. We want to carry that forward by lowering barriers to localization and global distribution, helping more stories travel between languages and cultures.
      - A global visual novel ecosystem brings more voices, perspectives, and creative traditions into the medium. It also gives individual creators access to larger audiences, making it more sustainable for them to keep creating.
  - title: Learning through visual novels
    paragraphs:
      - We believe visual novels hold great potential for learning beyond traditional education. They can immerse people, hold their attention, and support experiential learning through choices, consequences, and the freedom to try again.
      - We want to realize this potential and find new ways for visual novels to enrich people’s lives beyond entertainment.
