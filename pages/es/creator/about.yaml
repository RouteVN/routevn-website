- $partial: functionality-grid
  title: Todo lo que necesitas para tu novela visual
  message: Estudiamos las funciones habituales de las novelas visuales y las incorporamos de forma sencilla. Los enlaces de esta sección llevan a la documentación en inglés.
  sideImageSrc: /public/landing/object-4.png
  screenshotLabel: — captura de pantalla
  items:
    - title: Editor de diseño
      message: Personaliza por completo la interfaz de tu novela visual.
      imgSrc: /public/creator/docs/reference/layout-editor-2.png
      href: /en/creator/docs/layouts/
    - title: Gestión de recursos
      message: Organiza imágenes, audio, personajes y archivos del proyecto en un solo espacio de trabajo.
      imgSrc: /public/creator/docs/reference/images-2.png
      href: /en/creator/docs/images/
    - title: Mapa de escenas
      message: Consulta la estructura de tu novela visual y sigue fácilmente las distintas rutas narrativas.
      imgSrc: /public/creator/ss-7.png
      href: /en/creator/docs/scene-map/
    - title: Opciones y ramificaciones
      message: Añade opciones y conéctalas con la siguiente parte de la historia.
      imgSrc: /public/creator/docs/reference/choices-1.png
      href: /en/creator/docs/line-actions/choices/
    - title: Publica en la web
      message: Exporta tu proyecto y prepáralo para compartirlo en la web.
      imgSrc: /public/images/routevn_og.png
      href: /en/creator/docs/publish/

