- rtgl-view h="100":
- 'rtgl-view class="rvn-about-faq-shell" ah="c"':
    - rtgl-view d="h" md-d="v" w="f" av="c" g="lg" mb="lg":
        - rtgl-view w="1fg" md-w="f":
            - rtgl-text s="h4": Preguntas frecuentes
        - 'rtgl-view md-hide w="140" h="140" aria-hidden="true" style="flex: 0 0 140px;"':
            - 'img src="/public/landing/object-3.png" alt="" style="display: block; height: 100%; object-fit: contain; width: 100%;"':
    - rtgl-view g="lg" d="v" w="f":
        - rtgl-accordion-item w=f label="¿Qué diferencia a RouteVN Creator de otros motores de novelas visuales?" content="No necesitas programar ni tener conocimientos técnicos. RouteVN Creator permite que quienes escriben, dibujan o crean por afición hagan su propia novela visual. Es fácil de usar desde el principio y mantiene el proyecto organizado a medida que crece.":
        - rtgl-accordion-item w=f label="¿RouteVN Creator seguirá siendo gratuito?" content="Sí. Siempre habrá una versión gratuita y de código abierto. Es posible que añadamos funciones de pago en el futuro, pero serán opcionales y no limitarán la versión gratuita.":
        - rtgl-accordion-item w=f label="¿Cómo exporto mi novela visual?" content="Actualmente puedes exportar el proyecto como una versión web, formada por archivos HTML y JavaScript. Tenemos previsto ofrecer pronto compatibilidad con las principales plataformas, como Windows, macOS, Linux, Android y iOS.":
        - rtgl-accordion-item w=f label="¿Hay restricciones de contenido?" content="RouteVN Creator es solo una herramienta. Puedes crear lo que quieras. La aplicación funciona sin conexión, por lo que no podemos saber qué creas.":
        - rtgl-accordion-item w=f label="¿Cuáles son las limitaciones de RouteVN Creator?" content="RouteVN Creator resulta más adecuado para novelas visuales relativamente sencillas y sin mecánicas de juego complejas. Puede que no sea la herramienta adecuada si necesitas mecánicas personalizadas o funciones avanzadas poco habituales en las novelas visuales.":

