- style: |
    .rvn-about-faq-shell {
      box-sizing: border-box;
      width: min(1200px, 100%);
    }

    @media (max-width: 1280px) {
      .rvn-about-faq-shell {
        max-width: none;
        width: calc(100% - 32px);
      }
    }

    @media (max-width: 760px) {
      .rvn-about-faq-shell {
        width: calc(100% - 16px);
      }
    }

- $partial: blog-posts-grid
  title: RouteVN 博客
  message: 阅读更新、发布说明和开发记录。
  sideImageSrc: /public/landing/object-1.png
  ctaLabel: 查看文章
  ctaHref: /en/blog/

- rtgl-view h="100":
- 'rtgl-view class="rvn-about-faq-shell" ah="c"':
    - rtgl-view d="h" md-d="v" w="f" av="c" g="lg" mb="lg":
        - rtgl-view w="1fg" md-w="f":
            - rtgl-text s="h4": FAQ
        - 'rtgl-view md-hide w="140" h="140" aria-hidden="true" style="flex: 0 0 140px;"':
            - 'img src="/public/landing/object-3.png" alt="" style="display: block; height: 100%; object-fit: contain; width: 100%;"':
    - rtgl-view g="lg" d="v" w="f":
        - rtgl-accordion-item w=f label="RouteVN Creator 和其他视觉小说制作工具有什么不同？" content="RouteVN Creator 以无需编程为前提设计。它适合写剧本的人、画立绘的人、个人创作者和小团队快速开始制作。即使素材和场景逐渐变多，项目也更容易整理。":
        - rtgl-accordion-item w=f label="可以免费使用吗？" content="可以。免费版会继续作为免费、开源工具提供。未来可能会加入付费功能，但不会影响免费版的基本使用。":
        - rtgl-accordion-item w=f label="作品要怎么发布？" content="目前可以导出 Web 版。导出后会生成 HTML 和 JavaScript 文件，你可以把它发布到网站上。未来计划支持 Windows、macOS、Linux、Android、iOS 等平台。":
        - rtgl-accordion-item w=f label="可以制作的内容有限制吗？" content="RouteVN Creator 是制作工具。要制作什么内容由创作者自己决定。应用可以离线运行，因此我们不会查看你的创作内容。":
        - rtgl-accordion-item w=f label="RouteVN Creator 适合制作什么作品？" content="RouteVN Creator 适合以剧本、演出和分支选项为核心的视觉小说。如果你想制作复杂的战斗系统、自定义游戏机制或特殊小游戏，其他游戏引擎可能更适合。":

