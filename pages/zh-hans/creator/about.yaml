- $partial: feature-showcase
  title: 实时预览
  message: 编辑内容，立即查看效果
  backgroundColor: "#141414"
  foregroundColor: var(--foreground)
  themeClass: dark rvn-about-live-editor-section
  features:
    - title: 实时预览
      message: 修改剧本或演出后，可以在预览画面中立即查看效果。你可以一边创作，一边确认玩家实际看到的画面。
    - title: 直观操作
      message: 不需要特殊技术背景，也可以用剧本、立绘和背景图快速开始视觉小说制作。
  sideImageSrc: /public/landing/object-2.png
  videoSrc: /public/creator/animated-1.mp4
  learnMoreHref: /en/creator/docs/scene-editor/
  learnMoreLabel: 了解更多

- $partial: functionality-grid
  title: 视觉小说制作需要的功能，集中在一个工具里
  message: 从剧本、素材管理、画面布局、剧情分支到导出发布。RouteVN Creator 把视觉小说制作中常用的工作集中在一个制作工具里。
  sideImageSrc: /public/landing/object-4.png
  items:
    - title: 画面布局编辑
      message: 可以为标题画面、对话画面等制作适合作品风格的 UI。
      imgSrc: /public/creator/docs/reference/layout-editor-2.png
      href: /en/creator/docs/layouts/
    - title: 素材管理
      message: 可以在项目中整理立绘、背景图、音频等素材。
      imgSrc: /public/creator/ss-1.png
      href: /en/creator/docs/images/
    - title: 场景流程
      message: 可以查看场景之间的连接和分支，整理整个故事的结构。
      imgSrc: /public/creator/ss-7.png
      href: /en/creator/docs/scene-map/
    - title: 选项与剧情分支
      message: 可以创建选项，并把不同选项连接到对应的后续场景。
      imgSrc: /public/creator/docs/reference/choices-1.png
      href: /en/creator/docs/line-actions/choices/
    - title: 发布
      message: 完成后可以导出 Web 版，并发布到网上。
      imgSrc: /public/images/routevn_og.png
      href: /en/creator/docs/publish/

- style: |
    .rvn-about-faq-shell {
      box-sizing: border-box;
      width: min(1200px, 100%);
    }

    @media (max-width: 1280px) {
      .rvn-about-faq-shell {
        max-width: none;
        width: calc(100% - 32px);
      }
    }

    @media (max-width: 760px) {
      .rvn-about-faq-shell {
        width: calc(100% - 16px);
      }
    }

