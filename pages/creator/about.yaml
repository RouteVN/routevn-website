- rtgl-view h="100":
- rtgl-view ah="c" ph="lg" md-w="100vw" lg-w="768" w="1024":
    - rtgl-view d="h" md-d="v" w="f" av="c" g="lg" mb="lg":
        - rtgl-view w="1fg" md-w="f":
            - rtgl-text s="h4": ${site.creator.about.faq.title}
        - $if site.creator.about.faq.sideImageSrc:
            - 'rtgl-view md-hide w="140" h="140" aria-hidden="true" style="flex: 0 0 140px;"':
                - 'img src="${site.creator.about.faq.sideImageSrc}" alt="" style="display: block; height: 100%; object-fit: contain; width: 100%;"':
    - rtgl-view g="lg" d="v" w="f":
        - $for item in site.creator.about.faq.items:
            - rtgl-accordion-item w=f label="${item.title}" content="${item.content}":

- rtgl-view h="100":
