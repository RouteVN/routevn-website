      vndbHref: https://vndb.org/v66547
      description: Lors d’une journée qui s’annonçait ordinaire, vous trouvez Lune, une jeune fille allongée dans l’herbe au pied de votre immeuble. Cette étrange rencontre n’est qu’un début. Dès lors, vos destins s’entremêlent et vous traversez ensemble différents mondes par l’intermédiaire de la mort.
