- $partial: functionality-grid
  title: Tout ce qu’il vous faut pour votre visual novel
  message: Nous étudions les fonctions courantes des visual novels et les intégrons de façon simple à utiliser. Les liens de cette section mènent à la documentation en anglais.
  sideImageSrc: /public/landing/object-4.png
  screenshotLabel: — capture d’écran
  items:
    - title: Éditeur de mise en page
      message: Personnalisez entièrement l’interface de votre visual novel.
      imgSrc: /public/creator/docs/reference/layout-editor-2.png
      href: /en/creator/docs/layouts/
    - title: Gestion des ressources
      message: Organisez les images, l’audio, les personnages et les fichiers du projet dans un seul espace de travail.
      imgSrc: /public/creator/docs/reference/images-2.png
      href: /en/creator/docs/images/
    - title: Carte des scènes
      message: Visualisez la structure de votre visual novel et suivez facilement les différents parcours narratifs.
      imgSrc: /public/creator/ss-7.png
      href: /en/creator/docs/scene-map/
    - title: Choix et embranchements
      message: Ajoutez des choix et reliez-les à la suite de votre histoire.
      imgSrc: /public/creator/docs/reference/choices-1.png
      href: /en/creator/docs/line-actions/choices/
    - title: Publier sur le Web
      message: Exportez votre projet et préparez-le pour le partager sur le Web.
      imgSrc: /public/images/routevn_og.png
      href: /en/creator/docs/publish/

