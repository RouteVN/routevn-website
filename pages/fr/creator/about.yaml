- rtgl-view h="100":
- 'rtgl-view class="rvn-about-faq-shell" ah="c"':
    - rtgl-view d="h" md-d="v" w="f" av="c" g="lg" mb="lg":
        - rtgl-view w="1fg" md-w="f":
            - rtgl-text s="h4": Questions fréquentes
        - 'rtgl-view md-hide w="140" h="140" aria-hidden="true" style="flex: 0 0 140px;"':
            - 'img src="/public/landing/object-3.png" alt="" style="display: block; height: 100%; object-fit: contain; width: 100%;"':
    - rtgl-view g="lg" d="v" w="f":
        - rtgl-accordion-item w=f label="Qu’est-ce qui distingue RouteVN Creator des autres moteurs de visual novel ?" content="Pas besoin de coder ni d’avoir de connaissances techniques. RouteVN Creator permet aux personnes qui écrivent, dessinent ou créent par passion de réaliser leur propre visual novel. Facile à prendre en main, il reste organisé à mesure que le projet grandit.":
        - rtgl-accordion-item w=f label="RouteVN Creator restera-t-il toujours gratuit ?" content="Oui. Une version gratuite et open source restera toujours disponible. Nous pourrons ajouter des fonctions payantes à l’avenir, mais elles seront facultatives et ne limiteront pas la version gratuite.":
        - rtgl-accordion-item w=f label="Comment exporter mon visual novel ?" content="Vous pouvez actuellement exporter votre projet en version Web, sous forme de fichiers HTML et JavaScript. Nous prévoyons de prendre bientôt en charge les principales plateformes, notamment Windows, macOS, Linux, Android et iOS.":
        - rtgl-accordion-item w=f label="Existe-t-il des restrictions de contenu ?" content="RouteVN Creator n’est qu’un outil. Vous pouvez créer ce que vous voulez. L’application fonctionne hors ligne. Nous ne pouvons donc pas savoir ce que vous créez.":
        - rtgl-accordion-item w=f label="Quelles sont les limites de RouteVN Creator ?" content="RouteVN Creator convient surtout aux visual novels relativement simples, sans mécaniques de jeu complexes. Il peut ne pas convenir si votre projet nécessite des mécaniques personnalisées ou des fonctions avancées peu courantes dans les visual novels.":

