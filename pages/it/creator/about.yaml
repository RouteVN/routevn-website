- $partial: functionality-grid
  title: Tutto ciò che ti serve per la tua visual novel
  message: Studiamo le funzioni più comuni delle visual novel e le integriamo in modo semplice da usare. I link di questa sezione aprono la documentazione in inglese.
  sideImageSrc: /public/landing/object-4.png
  screenshotLabel: — schermata
  items:
    - title: Editor del layout
      message: Personalizza completamente l’interfaccia della tua visual novel.
      imgSrc: /public/creator/docs/reference/layout-editor-2.png
      href: /en/creator/docs/layouts/
    - title: Gestione delle risorse
      message: Organizza immagini, audio, personaggi e file del progetto in un unico spazio di lavoro.
      imgSrc: /public/creator/docs/reference/images-2.png
      href: /en/creator/docs/images/
    - title: Mappa delle scene
      message: Visualizza la struttura della tua visual novel e segui facilmente i diversi percorsi narrativi.
      imgSrc: /public/creator/ss-7.png
      href: /en/creator/docs/scene-map/
    - title: Scelte e bivi
      message: Aggiungi scelte e collegale alla parte successiva della storia.
      imgSrc: /public/creator/docs/reference/choices-1.png
      href: /en/creator/docs/line-actions/choices/
    - title: Pubblica sul web
      message: Esporta il progetto e preparalo per condividerlo sul web.
      imgSrc: /public/images/routevn_og.png
      href: /en/creator/docs/publish/

