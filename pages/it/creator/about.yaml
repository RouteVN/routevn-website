- rtgl-view h="100":
- 'rtgl-view class="rvn-about-faq-shell" ah="c"':
    - rtgl-view d="h" md-d="v" w="f" av="c" g="lg" mb="lg":
        - rtgl-view w="1fg" md-w="f":
            - rtgl-text s="h4": Domande frequenti
        - 'rtgl-view md-hide w="140" h="140" aria-hidden="true" style="flex: 0 0 140px;"':
            - 'img src="/public/landing/object-3.png" alt="" style="display: block; height: 100%; object-fit: contain; width: 100%;"':
    - rtgl-view g="lg" d="v" w="f":
        - rtgl-accordion-item w=f label="Che cosa distingue RouteVN Creator dagli altri motori per visual novel?" content="Non servono programmazione né conoscenze tecniche. RouteVN Creator permette a chi scrive, disegna o crea per passione di realizzare la propria visual novel. È facile da usare fin dall’inizio e mantiene il progetto organizzato man mano che cresce.":
        - rtgl-accordion-item w=f label="RouteVN Creator resterà sempre gratuito?" content="Sì. Sarà sempre disponibile una versione gratuita e open source. In futuro potremmo aggiungere funzionalità a pagamento, ma saranno facoltative e non limiteranno la versione gratuita.":
        - rtgl-accordion-item w=f label="Come posso esportare la mia visual novel?" content="Al momento puoi esportare il progetto come versione web, composta da file HTML e JavaScript. Prevediamo di supportare presto le principali piattaforme, tra cui Windows, macOS, Linux, Android e iOS.":
        - rtgl-accordion-item w=f label="Ci sono limitazioni sui contenuti?" content="RouteVN Creator è solo uno strumento. Puoi creare ciò che vuoi. L’applicazione funziona offline, quindi non possiamo sapere che cosa crei.":
        - rtgl-accordion-item w=f label="Quali sono i limiti di RouteVN Creator?" content="RouteVN Creator è adatto soprattutto a visual novel relativamente semplici, senza meccaniche di gioco complesse. Potrebbe non essere adatto se il progetto richiede meccaniche personalizzate o funzionalità avanzate poco comuni nelle visual novel.":

