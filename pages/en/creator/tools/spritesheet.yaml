- script: |
    (() => {
      const root = document.querySelector("[data-rvn-spritesheet-tool='true']");

      if (!root || root.dataset.rvnInitialized === "true") {
        return;
      }

      root.dataset.rvnInitialized = "true";

      const MAX_CANVAS_SIDE = 8192;
      const MAX_CANVAS_PIXELS = 67108864;
      const MAX_FRAMES = 2048;
      const textEncoder = new TextEncoder();

      const els = {
        outputName: document.getElementById("rvn-output-name"),
        frameWidth: document.getElementById("rvn-frame-width"),
        frameHeight: document.getElementById("rvn-frame-height"),
        previewFps: document.getElementById("rvn-preview-fps"),
        fileInput: document.getElementById("rvn-file-input"),
        dropzone: document.getElementById("rvn-dropzone"),
        matchSize: document.getElementById("rvn-match-size"),
        download: document.getElementById("rvn-download"),
        previewCanvas: document.getElementById("rvn-preview-canvas"),
        previewToggle: document.getElementById("rvn-preview-toggle"),
        sourceCount: document.getElementById("rvn-source-count"),
        sourceList: document.getElementById("rvn-source-list"),
      };

      const state = {
        atlasCanvas: document.createElement("canvas"),
        atlasJson: null,
        atlasWidth: 0,
        atlasHeight: 0,
        frameHeight: 256,
        frameWidth: 256,
        frames: [],
        lastTime: 0,
        previewIndex: 0,
        previewPlaying: true,
        sources: [],
      };

      let nextSourceId = 1;

      function positiveInt(value, fallback) {
        const number = Number(value);

        if (!Number.isFinite(number) || number < 1) {
          return fallback;
        }

        return Math.floor(number);
      }

      function clampFrameCount(value) {
        return Math.max(1, Math.min(999, positiveInt(value, 1)));
      }

      function sanitizeBaseName(value, fallback) {
        const clean = String(value || "")
          .replace(/\.[^.]+$/, "")
          .replace(/[^a-zA-Z0-9_-]+/g, "-")
          .replace(/^-+|-+$/g, "");

        return clean || fallback || "spritesheet";
      }

      function getOutputBaseName() {
        return sanitizeBaseName(
          els.outputName.value.replace(/\.(zip|png|json)$/i, ""),
          "spritesheet"
        );
      }

      function loadImageFile(file) {
        return new Promise((resolve, reject) => {
          const objectUrl = URL.createObjectURL(file);
          const image = new Image();

          image.onload = () => {
            resolve({
              file,
              frameCount: 1,
              height: image.naturalHeight,
              id: nextSourceId++,
              image,
              name: file.name,
              objectUrl,
              width: image.naturalWidth,
            });
          };

          image.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            reject(new Error("Could not load " + file.name + "."));
          };

          image.src = objectUrl;
        });
      }

      async function addFiles(fileList) {
        const files = Array.from(fileList || []);
        const pngFiles = files.filter((file) => file.type === "image/png" || /\.png$/i.test(file.name));
        const ignoredCount = files.length - pngFiles.length;

        if (pngFiles.length === 0) {
          return;
        }

        const results = await Promise.allSettled(pngFiles.map(loadImageFile));
        const loaded = [];
        const failed = [];

        results.forEach((result) => {
          if (result.status === "fulfilled") {
            loaded.push(result.value);
          } else {
            failed.push(result.reason.message);
          }
        });

        state.sources.push.apply(state.sources, loaded);

        if (state.sources.length === loaded.length && loaded.length > 0) {
          const first = loaded[0];
          els.frameWidth.value = String(Math.max(1, first.width));
          els.frameHeight.value = String(Math.max(1, first.height));
        }

        renderSources();
        rebuild();

        void ignoredCount;
        void failed;

        els.fileInput.value = "";
      }

      function removeSource(id) {
        const index = state.sources.findIndex((source) => source.id === id);

        if (index === -1) {
          return;
        }

        URL.revokeObjectURL(state.sources[index].objectUrl);
        state.sources.splice(index, 1);
        state.previewIndex = 0;
        renderSources();
        rebuild();
      }

      function moveSource(id, direction) {
        const index = state.sources.findIndex((source) => source.id === id);
        const nextIndex = index + direction;

        if (index === -1 || nextIndex < 0 || nextIndex >= state.sources.length) {
          return;
        }

        const source = state.sources[index];
        state.sources[index] = state.sources[nextIndex];
        state.sources[nextIndex] = source;
        state.previewIndex = 0;
        renderSources();
        rebuild();
      }

      function matchFirstImageSize() {
        const first = state.sources[0];

        if (!first) {
          return;
        }

        els.frameWidth.value = String(Math.max(1, first.width));
        els.frameHeight.value = String(Math.max(1, first.height));
        rebuild();
        renderSources();
      }

      function renderSources() {
        els.sourceList.innerHTML = "";
        els.sourceCount.textContent = state.sources.length + " file" + (state.sources.length === 1 ? "" : "s");

        if (state.sources.length === 0) {
          const empty = document.createElement("div");
          empty.className = "rvn-source-empty";
          empty.textContent = "No images selected.";
          els.sourceList.appendChild(empty);
          return;
        }

        state.sources.forEach((source, index) => {
          const item = document.createElement("article");
          item.className = "rvn-source-item";

          const preview = document.createElement("div");
          preview.className = "rvn-source-preview";

          const image = document.createElement("img");
          image.alt = "";
          image.draggable = false;
          image.src = source.objectUrl;
          preview.appendChild(image);

          const count = clampFrameCount(source.frameCount);

          const main = document.createElement("div");
          main.className = "rvn-source-main";

          const name = document.createElement("div");
          name.className = "rvn-source-name";
          name.textContent = String(index + 1) + ". " + source.name;

          const details = document.createElement("div");
          details.className = "rvn-source-details";

          main.appendChild(name);
          main.appendChild(details);

          const controls = document.createElement("div");
          controls.className = "rvn-source-controls";

          const label = document.createElement("label");
          label.className = "rvn-field-label";
          label.htmlFor = "rvn-source-frames-" + source.id;
          label.textContent = "Duration frames";

          const input = document.createElement("input");
          input.className = "rvn-input";
          input.id = "rvn-source-frames-" + source.id;
          input.inputMode = "numeric";
          input.max = "999";
          input.min = "1";
          input.step = "1";
          input.type = "number";
          input.value = String(count);
          input.addEventListener("input", () => {
            source.frameCount = clampFrameCount(input.value);
            refreshSourceInfo();
            rebuild();
          });
          input.addEventListener("change", () => {
            source.frameCount = clampFrameCount(input.value);
            input.value = String(source.frameCount);
            refreshSourceInfo();
            rebuild();
          });

          controls.appendChild(label);
          controls.appendChild(input);

          const orderControls = document.createElement("div");
          orderControls.className = "rvn-source-order";

          const moveUpButton = document.createElement("button");
          moveUpButton.className = "rvn-secondary-button";
          moveUpButton.disabled = index === 0;
          moveUpButton.type = "button";
          moveUpButton.textContent = "Move up";
          moveUpButton.addEventListener("click", () => moveSource(source.id, -1));

          const moveDownButton = document.createElement("button");
          moveDownButton.className = "rvn-secondary-button";
          moveDownButton.disabled = index === state.sources.length - 1;
          moveDownButton.type = "button";
          moveDownButton.textContent = "Move down";
          moveDownButton.addEventListener("click", () => moveSource(source.id, 1));

          orderControls.appendChild(moveUpButton);
          orderControls.appendChild(moveDownButton);

          const removeButton = document.createElement("button");
          removeButton.className = "rvn-secondary-button rvn-source-remove";
          removeButton.type = "button";
          removeButton.textContent = "Remove";
          removeButton.addEventListener("click", () => removeSource(source.id));

          item.appendChild(preview);
          item.appendChild(main);
          item.appendChild(controls);
          item.appendChild(orderControls);
          item.appendChild(removeButton);
          els.sourceList.appendChild(item);

          function refreshSourceInfo() {
            details.textContent = source.width + " x " + source.height + " source.";
          }

          refreshSourceInfo();
        });
      }

      function collectFrames() {
        const atlasFrames = [];
        const playbackFrames = [];
        const usedNames = new Set();

        state.sources.forEach((source) => {
          const count = clampFrameCount(source.frameCount);
          const baseName = sanitizeBaseName(source.name, "frame");
          let frameName = baseName + ".png";
          let suffix = 2;

          while (usedNames.has(frameName)) {
            frameName = baseName + "_" + suffix + ".png";
            suffix += 1;
          }

          usedNames.add(frameName);

          const frame = {
            frameName,
            source,
            sourceH: source.height,
            sourceW: source.width,
            sourceX: 0,
            sourceY: 0,
          };

          atlasFrames.push(frame);

          for (let index = 0; index < count; index += 1) {
            playbackFrames.push(frame);
          }
        });

        return { atlasFrames, playbackFrames };
      }

      function chooseColumns(totalFrames, frameWidth, frameHeight) {
        if (totalFrames <= 1) {
          return 1;
        }

        return Math.max(1, Math.ceil(Math.sqrt(totalFrames * frameHeight / frameWidth)));
      }

      function rebuild() {
        const frameWidth = positiveInt(els.frameWidth.value, 0);
        const frameHeight = positiveInt(els.frameHeight.value, 0);
        const frameData = collectFrames();
        const frames = frameData.atlasFrames;
        const playbackFrames = frameData.playbackFrames;
        const errors = [];
        const totalFrames = playbackFrames.length;

        state.frameWidth = frameWidth;
        state.frameHeight = frameHeight;
        state.frames = [];
        state.atlasJson = null;
        state.atlasWidth = 0;
        state.atlasHeight = 0;

        if (state.sources.length === 0) {
          els.download.disabled = true;
          updatePreviewToggle();
          drawPreview();
          return;
        }

        if (frameWidth < 1 || frameHeight < 1) {
          errors.push("Frame width and frame height must be at least 1.");
        }

        if (totalFrames > MAX_FRAMES) {
          errors.push("The tool supports up to " + MAX_FRAMES + " frames per export.");
        }

        const columns = chooseColumns(Math.max(frames.length, 1), Math.max(frameWidth, 1), Math.max(frameHeight, 1));
        const rows = Math.max(1, Math.ceil(frames.length / columns));
        const atlasWidth = columns * frameWidth;
        const atlasHeight = rows * frameHeight;

        if (atlasWidth > MAX_CANVAS_SIDE || atlasHeight > MAX_CANVAS_SIDE) {
          errors.push("Atlas is too large. Keep the generated PNG at or below " + MAX_CANVAS_SIDE + " x " + MAX_CANVAS_SIDE + ".");
        }

        if (atlasWidth * atlasHeight > MAX_CANVAS_PIXELS) {
          errors.push("Atlas has too many pixels for this browser tool.");
        }

        if (errors.length > 0) {
          els.download.disabled = true;
          updatePreviewToggle();
          drawPreview();
          return;
        }

        state.atlasCanvas.width = atlasWidth;
        state.atlasCanvas.height = atlasHeight;
        state.atlasWidth = atlasWidth;
        state.atlasHeight = atlasHeight;

        const context = state.atlasCanvas.getContext("2d");
        context.clearRect(0, 0, atlasWidth, atlasHeight);

        const atlasFrames = {};

        frames.forEach((frame, index) => {
          const column = index % columns;
          const row = Math.floor(index / columns);
          const x = column * frameWidth;
          const y = row * frameHeight;

          context.drawImage(
            frame.source.image,
            frame.sourceX,
            frame.sourceY,
            frame.sourceW,
            frame.sourceH,
            x,
            y,
            frameWidth,
            frameHeight
          );

          frame.x = x;
          frame.y = y;
          frame.w = frameWidth;
          frame.h = frameHeight;
          atlasFrames[frame.frameName] = {
            frame: { x, y, w: frameWidth, h: frameHeight },
            rotated: false,
            trimmed: false,
            spriteSourceSize: { x: 0, y: 0, w: frameWidth, h: frameHeight },
            sourceSize: { w: frameWidth, h: frameHeight },
          };
        });

        state.frames = playbackFrames;
        state.atlasJson = {
          frames: atlasFrames,
          animations: {
            animation: playbackFrames.map((frame) => frame.frameName),
          },
          meta: {
            image: getOutputBaseName() + ".png",
            size: { w: atlasWidth, h: atlasHeight },
            scale: "1",
          },
        };

        els.download.disabled = false;
        updatePreviewToggle();
        drawPreview();
      }

      function resizePreviewCanvas() {
        const canvas = els.previewCanvas;
        const rect = canvas.getBoundingClientRect();
        const pixelRatio = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        const width = Math.max(1, Math.floor(rect.width * pixelRatio));
        const height = Math.max(1, Math.floor(rect.height * pixelRatio));

        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }

        return { height, pixelRatio, width };
      }

      function drawPreview() {
        const canvas = els.previewCanvas;
        const size = resizePreviewCanvas();
        const context = canvas.getContext("2d");

        context.clearRect(0, 0, size.width, size.height);

        if (!state.frames.length || !state.atlasJson) {
          context.save();
          context.fillStyle = "rgba(255, 255, 255, 0.55)";
          context.font = Math.round(14 * size.pixelRatio) + "px sans-serif";
          context.textAlign = "center";
          context.textBaseline = "middle";
          context.fillText("No preview", size.width / 2, size.height / 2);
          context.restore();
          return;
        }

        state.previewIndex %= state.frames.length;

        const frame = state.frames[state.previewIndex];
        const padding = 24 * size.pixelRatio;
        const availableWidth = Math.max(1, size.width - padding * 2);
        const availableHeight = Math.max(1, size.height - padding * 2);
        const scale = Math.min(availableWidth / frame.w, availableHeight / frame.h);
        const drawWidth = frame.w * scale;
        const drawHeight = frame.h * scale;
        const x = (size.width - drawWidth) / 2;
        const y = (size.height - drawHeight) / 2;

        context.drawImage(
          state.atlasCanvas,
          frame.x,
          frame.y,
          frame.w,
          frame.h,
          x,
          y,
          drawWidth,
          drawHeight
        );
      }

      function togglePreviewPlayback() {
        state.previewPlaying = !state.previewPlaying;
        state.lastTime = 0;
        updatePreviewToggle();
        drawPreview();
      }

      function updatePreviewToggle() {
        const hasPreview = state.frames.length > 0 && Boolean(state.atlasJson);

        els.previewToggle.disabled = !hasPreview;
        els.previewToggle.textContent = state.previewPlaying ? "Stop preview" : "Start preview";
        els.previewToggle.setAttribute("aria-pressed", state.previewPlaying ? "true" : "false");
      }

      function tick(time) {
        const fps = Math.max(1, Math.min(60, positiveInt(els.previewFps.value, 12)));
        const delay = 1000 / fps;

        if (state.previewPlaying && time - state.lastTime >= delay) {
          state.lastTime = time;

          if (state.frames.length > 0) {
            state.previewIndex = (state.previewIndex + 1) % state.frames.length;
          }

          drawPreview();
        }

        window.requestAnimationFrame(tick);
      }

      function canvasToBlob(canvas) {
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) {
              resolve(blob);
            } else {
              reject(new Error("Could not create PNG output."));
            }
          }, "image/png");
        });
      }

      async function downloadZip() {
        rebuild();

        if (!state.atlasJson || !state.frames.length) {
          return;
        }

        const baseName = getOutputBaseName();
        const pngBlob = await canvasToBlob(state.atlasCanvas);
        const pngBytes = new Uint8Array(await pngBlob.arrayBuffer());
        const jsonText = JSON.stringify({
          frames: state.atlasJson.frames,
          animations: state.atlasJson.animations,
          meta: {
            image: baseName + ".png",
            size: state.atlasJson.meta.size,
            scale: state.atlasJson.meta.scale,
          },
        }, null, 2);
        const zipBlob = createZip([
          { name: baseName + ".png", data: pngBytes },
          { name: baseName + ".json", data: textEncoder.encode(jsonText) },
        ]);
        const url = URL.createObjectURL(zipBlob);
        const anchor = document.createElement("a");

        anchor.href = url;
        anchor.download = baseName + ".zip";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();

        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function makeCrcTable() {
        const table = new Uint32Array(256);

        for (let index = 0; index < 256; index += 1) {
          let crc = index;

          for (let bit = 0; bit < 8; bit += 1) {
            crc = crc & 1 ? 0xedb88320 ^ (crc >>> 1) : crc >>> 1;
          }

          table[index] = crc >>> 0;
        }

        return table;
      }

      const crcTable = makeCrcTable();

      function crc32(bytes) {
        let crc = 0xffffffff;

        for (let index = 0; index < bytes.length; index += 1) {
          crc = crcTable[(crc ^ bytes[index]) & 0xff] ^ (crc >>> 8);
        }

        return (crc ^ 0xffffffff) >>> 0;
      }

      function dosDateTime(date) {
        const year = Math.max(1980, date.getFullYear());
        const dosTime = (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2);
        const dosDate = ((year - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();

        return { dosDate, dosTime };
      }

      function createZip(files) {
        const localParts = [];
        const centralParts = [];
        const dateParts = dosDateTime(new Date());
        let offset = 0;

        files.forEach((file) => {
          const nameBytes = textEncoder.encode(file.name);
          const data = file.data;
          const checksum = crc32(data);
          const localHeader = new Uint8Array(30 + nameBytes.length);
          const localView = new DataView(localHeader.buffer);

          localView.setUint32(0, 0x04034b50, true);
          localView.setUint16(4, 20, true);
          localView.setUint16(6, 0, true);
          localView.setUint16(8, 0, true);
          localView.setUint16(10, dateParts.dosTime, true);
          localView.setUint16(12, dateParts.dosDate, true);
          localView.setUint32(14, checksum, true);
          localView.setUint32(18, data.length, true);
          localView.setUint32(22, data.length, true);
          localView.setUint16(26, nameBytes.length, true);
          localView.setUint16(28, 0, true);
          localHeader.set(nameBytes, 30);

          localParts.push(localHeader, data);

          const centralHeader = new Uint8Array(46 + nameBytes.length);
          const centralView = new DataView(centralHeader.buffer);

          centralView.setUint32(0, 0x02014b50, true);
          centralView.setUint16(4, 20, true);
          centralView.setUint16(6, 20, true);
          centralView.setUint16(8, 0, true);
          centralView.setUint16(10, 0, true);
          centralView.setUint16(12, dateParts.dosTime, true);
          centralView.setUint16(14, dateParts.dosDate, true);
          centralView.setUint32(16, checksum, true);
          centralView.setUint32(20, data.length, true);
          centralView.setUint32(24, data.length, true);
          centralView.setUint16(28, nameBytes.length, true);
          centralView.setUint16(30, 0, true);
          centralView.setUint16(32, 0, true);
          centralView.setUint16(34, 0, true);
          centralView.setUint16(36, 0, true);
          centralView.setUint32(38, 0, true);
          centralView.setUint32(42, offset, true);
          centralHeader.set(nameBytes, 46);

          centralParts.push(centralHeader);
          offset += localHeader.length + data.length;
        });

        const centralOffset = offset;
        const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
        const endHeader = new Uint8Array(22);
        const endView = new DataView(endHeader.buffer);

        endView.setUint32(0, 0x06054b50, true);
        endView.setUint16(4, 0, true);
        endView.setUint16(6, 0, true);
        endView.setUint16(8, files.length, true);
        endView.setUint16(10, files.length, true);
        endView.setUint32(12, centralSize, true);
        endView.setUint32(16, centralOffset, true);
        endView.setUint16(20, 0, true);

        return new Blob(localParts.concat(centralParts, endHeader), { type: "application/zip" });
      }

      els.fileInput.addEventListener("change", (event) => addFiles(event.target.files));
      els.dropzone.addEventListener("click", () => els.fileInput.click());
      els.dropzone.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          els.fileInput.click();
        }
      });
      els.dropzone.addEventListener("dragover", (event) => {
        event.preventDefault();
        els.dropzone.classList.add("is-dragging");
      });
      els.dropzone.addEventListener("dragleave", () => {
        els.dropzone.classList.remove("is-dragging");
      });
      els.dropzone.addEventListener("drop", (event) => {
        event.preventDefault();
        els.dropzone.classList.remove("is-dragging");
        addFiles(event.dataTransfer.files);
      });
      els.frameWidth.addEventListener("input", () => {
        renderSources();
        rebuild();
      });
      els.frameHeight.addEventListener("input", () => {
        renderSources();
        rebuild();
      });
      els.previewFps.addEventListener("input", rebuild);
      els.outputName.addEventListener("input", rebuild);
      els.matchSize.addEventListener("click", matchFirstImageSize);
      els.download.addEventListener("click", downloadZip);
      els.previewToggle.addEventListener("click", togglePreviewPlayback);
      window.addEventListener("resize", drawPreview, { passive: true });

      renderSources();
      rebuild();
      window.requestAnimationFrame(tick);
    })();
