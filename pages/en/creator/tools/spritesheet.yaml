---
template: base
title: RouteVN Spritesheet Tool
seo:
  title: RouteVN Spritesheet Tool - PNG to PixiJS Atlas
  description: Create a PixiJS spritesheet PNG and atlas JSON from uploaded PNG images in the browser.
---
- h1 class="sr-only": RouteVN Spritesheet Tool
- style: |
    .rvn-spritesheet-tool {
      --rvn-tool-panel: #1e1e1e;
      --rvn-tool-panel-soft: #242424;
      --rvn-tool-border: rgba(255, 255, 255, 0.12);
      --rvn-tool-muted: rgba(255, 255, 255, 0.68);
      --rvn-tool-focus: rgba(255, 255, 255, 0.14);
      box-sizing: border-box;
      display: grid;
      gap: 24px;
      margin: 56px auto 0;
      max-width: 1180px;
      width: min(100%, calc(100vw - 32px));
    }

    .rvn-spritesheet-tool *,
    .rvn-spritesheet-tool *::before,
    .rvn-spritesheet-tool *::after {
      box-sizing: border-box;
    }

    .rvn-tool-header {
      align-items: end;
      display: flex;
      gap: 16px;
      justify-content: space-between;
    }

    .rvn-tool-title {
      margin: 0;
    }


    .rvn-tool-actions {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .rvn-tool-grid {
      align-items: start;
      display: grid;
      gap: 16px;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      width: 100%;
    }

    .rvn-tool-panel,
    .rvn-preview-panel,
    .rvn-sources-panel {
      background: var(--rvn-tool-panel);
      border: 1px solid var(--rvn-tool-border);
      border-radius: 8px;
    }

    .rvn-tool-panel,
    .rvn-preview-panel {
      padding: 16px;
    }

    .rvn-tool-panel {
      display: grid;
      gap: 16px;
      grid-template-columns: minmax(0, 1fr);
      min-width: 0;
      width: 100%;
    }

    .rvn-fieldset {
      border: 0;
      display: grid;
      gap: 12px;
      margin: 0;
      min-inline-size: 0;
      padding: 0;
      width: 100%;
    }

    .rvn-fieldset legend,
    .rvn-panel-title {
      color: var(--foreground);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.3;
      margin: 0;
      padding: 0;
    }

    .rvn-field-row {
      display: grid;
      gap: 8px;
      width: 100%;
    }

    .rvn-two-col {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      width: 100%;
    }

    .rvn-field-label {
      color: var(--rvn-tool-muted);
      font-size: 0.8rem;
      line-height: 1.2;
    }

    .rvn-input,
    .rvn-select {
      appearance: none;
      background: #111;
      border: 1px solid var(--rvn-tool-border);
      border-radius: 6px;
      color: var(--foreground);
      font: inherit;
      min-height: 40px;
      outline: none;
      padding: 8px 10px;
      width: 100%;
    }

    .rvn-input:focus,
    .rvn-select:focus {
      border-color: var(--foreground);
      box-shadow: 0 0 0 3px var(--rvn-tool-focus);
    }

    .rvn-tool-button,
    .rvn-secondary-button {
      align-items: center;
      border: 1px solid var(--rvn-tool-border);
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      justify-content: center;
      min-height: 40px;
      padding: 8px 12px;
      text-decoration: none;
      transition: border-color 120ms ease, background 120ms ease, color 120ms ease;
      width: auto;
    }

    .rvn-tool-button {
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .rvn-secondary-button {
      background: #151515;
      color: var(--foreground);
    }

    .rvn-tool-button:hover,
    .rvn-secondary-button:hover {
      border-color: rgba(255, 255, 255, 0.28);
    }

    .rvn-tool-button:disabled,
    .rvn-secondary-button:disabled {
      cursor: not-allowed;
      filter: grayscale(1);
      opacity: 0.48;
    }

    .rvn-button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
    }

    .rvn-button-row .rvn-secondary-button,
    .rvn-tool-panel > .rvn-tool-button {
      width: 100%;
    }

    .rvn-dropzone {
      align-items: center;
      background: #151515;
      border: 1px dashed rgba(255, 255, 255, 0.24);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: center;
      margin-top: 8px;
      min-height: 128px;
      padding: 18px;
      text-align: center;
      width: 100%;
    }

    .rvn-dropzone:focus,
    .rvn-dropzone.is-dragging {
      border-color: var(--foreground);
      box-shadow: 0 0 0 3px var(--rvn-tool-focus);
      outline: none;
    }

    .rvn-dropzone-title {
      display: block;
      font-weight: 600;
      text-align: center;
      width: 100%;
    }

    .rvn-dropzone-hint {
      color: var(--rvn-tool-muted);
      display: block;
      text-align: center;
      width: 100%;
    }

    .rvn-file-input {
      height: 1px;
      opacity: 0;
      pointer-events: none;
      position: absolute;
      width: 1px;
    }

    .rvn-preview-panel {
      display: grid;
      gap: 12px;
    }

    .rvn-preview-head {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
    }

    .rvn-preview-toolbar {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .rvn-preview-fps-field {
      align-items: center;
      display: flex;
      gap: 8px;
    }

    .rvn-preview-fps-field .rvn-input {
      height: 40px;
      min-height: 40px;
      width: 76px;
    }

    .rvn-preview-meta {
      color: var(--rvn-tool-muted);
      font-size: 0.85rem;
      line-height: 1.3;
      margin: 0;
      text-align: right;
    }

    .rvn-preview-canvas-wrap {
      background-color: #111;
      border: 1px solid var(--rvn-tool-border);
      border-radius: 8px;
      height: 420px;
      overflow: hidden;
      position: relative;
      width: 100%;
    }

    .rvn-preview-canvas {
      display: block;
      height: 100%;
      width: 100%;
    }

    .rvn-sources-panel {
      overflow: hidden;
    }

    .rvn-sources-header {
      align-items: center;
      border-bottom: 1px solid var(--rvn-tool-border);
      display: flex;
      gap: 12px;
      justify-content: space-between;
      padding: 14px 16px;
    }

    .rvn-source-list {
      display: grid;
      gap: 0;
      grid-template-columns: minmax(0, 1fr);
      width: 100%;
    }

    .rvn-source-empty {
      color: var(--rvn-tool-muted);
      padding: 18px 16px;
    }

    .rvn-source-item {
      box-sizing: border-box;
      display: grid;
      gap: 14px;
      grid-template-columns: 168px minmax(0, 1fr) 160px 112px auto;
      padding: 16px;
      width: 100%;
    }

    .rvn-source-item + .rvn-source-item {
      border-top: 1px solid var(--rvn-tool-border);
    }

    .rvn-source-preview {
      align-items: center;
      background: #111;
      border: 1px solid var(--rvn-tool-border);
      border-radius: 8px;
      display: grid;
      min-height: 116px;
      overflow: hidden;
      position: relative;
    }

    .rvn-source-preview img {
      display: block;
      max-height: 132px;
      max-width: 100%;
      object-fit: contain;
      width: 100%;
    }

    .rvn-source-main {
      min-width: 0;
    }

    .rvn-source-name {
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .rvn-source-details {
      color: var(--rvn-tool-muted);
      font-size: 0.84rem;
      line-height: 1.35;
      margin-top: 6px;
    }

    .rvn-source-controls {
      align-content: start;
      display: grid;
      gap: 8px;
    }

    .rvn-source-controls .rvn-input {
      height: 40px;
    }

    .rvn-source-order {
      align-content: center;
      display: grid;
      gap: 8px;
    }

    .rvn-source-order .rvn-secondary-button {
      width: 100%;
    }

    .rvn-source-remove {
      align-self: center;
    }

    @media (max-width: 900px) {
      .rvn-tool-header {
        align-items: start;
        flex-direction: column;
      }

      .rvn-tool-actions {
        justify-content: flex-start;
      }

      .rvn-tool-grid {
        grid-template-columns: 1fr;
      }

      .rvn-source-item {
        grid-template-columns: 132px minmax(0, 1fr);
      }

      .rvn-source-controls,
      .rvn-source-order,
      .rvn-source-remove {
        grid-column: 2;
      }
    }

    @media (max-width: 620px) {
      .rvn-spritesheet-tool {
        margin-top: 40px;
        width: min(100%, calc(100vw - 20px));
      }

      .rvn-two-col {
        grid-template-columns: 1fr;
      }

      .rvn-preview-canvas-wrap {
        height: 300px;
      }

      .rvn-source-item {
        grid-template-columns: 1fr;
      }

      .rvn-source-controls,
      .rvn-source-order,
      .rvn-source-remove {
        grid-column: auto;
      }
    }
- 'rtgl-view class="rvn-spritesheet-tool" data-rvn-spritesheet-tool="true" g="xl"':
