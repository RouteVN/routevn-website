---
template: creator
title: RouteVN Creator Asset Store
disableFooterSpacer: true
seo:
  title: RouteVN Creator Asset Store
  description: Browse placeholder assets for RouteVN Creator.
---
- style: |
    .rvn-asset-store {
      --rvn-store-panel: #1f1f1f;
      --rvn-store-panel-soft: #252525;
      --rvn-store-border: rgba(255, 255, 255, 0.12);
      --rvn-store-muted: rgba(255, 255, 255, 0.68);
      --rvn-store-field: #121212;
      box-sizing: border-box;
      display: grid;
      gap: 24px;
      grid-template-columns: minmax(0, 1fr);
      margin: 56px auto 0;
      max-width: 1200px;
      width: 1200px !important;
    }

    .rvn-asset-store *,
    .rvn-asset-store *::before,
    .rvn-asset-store *::after {
      box-sizing: border-box;
    }

    .rvn-asset-store-header {
      align-items: end;
      display: flex;
      gap: 16px;
      justify-content: space-between;
      min-width: 0;
      width: 100% !important;
    }

    .rvn-asset-store-title {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.1;
      margin: 0;
    }

    .rvn-asset-store-subtitle {
      color: var(--rvn-store-muted);
      max-width: 640px;
    }

    .rvn-asset-store-layout {
      align-items: start;
      display: grid;
      gap: 18px;
      grid-template-columns: 280px minmax(0, 1fr);
      min-width: 0;
      width: 100%;
    }

    .rvn-asset-store-sidebar,
    .rvn-asset-store-results {
      background: var(--rvn-store-panel);
      border: 1px solid var(--rvn-store-border);
      border-radius: 8px;
    }

    .rvn-asset-store-sidebar {
      display: grid;
      gap: 18px;
      padding: 16px;
      position: sticky;
      top: 88px;
    }

    .rvn-filter-group {
      border: 0;
      display: grid;
      gap: 10px;
      margin: 0;
      min-inline-size: 0;
      padding: 0;
    }

    .rvn-filter-group legend,
    .rvn-asset-section-title {
      color: var(--foreground);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.3;
      margin: 0;
      padding: 0;
    }

    .rvn-filter-label {
      color: var(--rvn-store-muted);
      font-size: 0.82rem;
      line-height: 1.2;
    }

    .rvn-filter-input,
    .rvn-filter-select {
      appearance: none;
      background: var(--rvn-store-field);
      border: 1px solid var(--rvn-store-border);
      border-radius: 6px;
      color: var(--foreground);
      font: inherit;
      min-height: 40px;
      outline: none;
      padding: 8px 10px;
      width: 100%;
    }

    .rvn-filter-options {
      display: grid;
      gap: 8px;
    }

    .rvn-filter-check {
      align-items: center;
      color: var(--rvn-store-muted);
      display: flex;
      font-size: 0.92rem;
      gap: 8px;
      line-height: 1.3;
    }

    .rvn-filter-check input {
      accent-color: var(--primary);
      height: 16px;
      margin: 0;
      width: 16px;
    }

    .rvn-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .rvn-chip {
      background: var(--rvn-store-panel-soft);
      border: 1px solid var(--rvn-store-border);
      border-radius: 999px;
      color: var(--rvn-store-muted);
      font-size: 0.82rem;
      line-height: 1;
      padding: 8px 10px;
      white-space: nowrap;
    }

    .rvn-asset-store-results {
      display: grid;
      gap: 16px;
      grid-template-columns: minmax(0, 1fr);
      min-width: 0;
      padding: 16px;
    }

    .rvn-results-toolbar {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
    }

    .rvn-asset-count {
      color: var(--rvn-store-muted);
      font-size: 0.9rem;
    }

    .rvn-asset-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      width: 100% !important;
    }

    .rvn-asset-card {
      background: var(--rvn-store-panel-soft);
      border: 1px solid var(--rvn-store-border);
      border-radius: 8px;
      color: inherit;
      display: block;
      overflow: hidden;
      min-width: 0;
      text-decoration: none;
      transition: border-color 120ms ease, transform 120ms ease;
    }

    .rvn-asset-card:hover {
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .rvn-asset-thumb {
      aspect-ratio: 16 / 10;
      background: #111;
      display: block;
      overflow: hidden;
      position: relative;
      width: 100%;
    }

    .rvn-asset-thumb-video {
      display: block;
      filter: saturate(0.95) var(--thumb-filter, none);
      height: 100%;
      object-fit: cover;
      transform: scale(1.01);
      width: 100%;
    }

    .rvn-asset-card-body {
      display: grid;
      gap: 6px;
      padding: 12px;
    }

    .rvn-asset-type {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--rvn-store-border);
      border-radius: 999px;
      color: var(--rvn-store-muted);
      font-size: 0.74rem;
      line-height: 1;
      padding: 6px 8px;
      width: fit-content;
    }

    .rvn-asset-title {
      color: var(--foreground);
      font-weight: 600;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .rvn-asset-meta {
      color: var(--rvn-store-muted);
      font-size: 0.82rem;
      line-height: 1.25;
    }

    @media (max-width: 980px) {
      .rvn-asset-store-layout {
        grid-template-columns: 1fr;
      }

      .rvn-asset-store-sidebar {
        position: static;
      }

      .rvn-asset-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 1280px) {
      .rvn-asset-store {
        max-width: calc(100vw - 64px);
        width: calc(100vw - 64px) !important;
      }
    }

    @media (max-width: 760px) {
      .rvn-asset-store {
        max-width: calc(100vw - 48px);
        width: calc(100vw - 48px) !important;
      }
    }

    @media (max-width: 620px) {
      .rvn-asset-store {
        margin-top: 40px;
      }

      .rvn-asset-store-header {
        align-items: start;
        flex-direction: column;
      }

      .rvn-results-toolbar {
        align-items: start;
        flex-direction: column;
      }

      .rvn-asset-grid {
        grid-template-columns: 1fr;
      }
    }

- 'rtgl-view class="rvn-asset-store" g="xl"':
    - 'rtgl-view class="rvn-asset-store-header" d="h" md-d="v" w="f" av="e" md-av="s" g="lg"':
        - rtgl-view g="md":
            - rtgl-text class="rvn-asset-store-title" s="h1": Asset Store
            - rtgl-text class="rvn-asset-store-subtitle" s="md": Browse ready-to-use assets for RouteVN Creator. This page is a static placeholder while the store experience is being designed.
        - rtgl-view class="rvn-asset-store-spacer" w="1fg" md-hide:
        - rtgl-button v="se" disabled: Coming soon
    - rtgl-view class="rvn-asset-store-layout" w="f":
        - 'rtgl-view class="rvn-asset-store-sidebar" role="search" aria-label="Asset store filters"':
            - fieldset class="rvn-filter-group":
                - legend: Search
                - label class="rvn-filter-label" for="rvn-asset-search": Keyword
                - 'input id="rvn-asset-search" class="rvn-filter-input" type="search" value="background" disabled':
            - fieldset class="rvn-filter-group":
                - legend: Category
                - rtgl-view class="rvn-filter-options":
                    - label class="rvn-filter-check":
                        - 'input type="checkbox" checked disabled':
                        - span: Backgrounds
