                        - 'input type="checkbox" disabled':
                        - span: Sound effects
            - fieldset class="rvn-filter-group":
                - legend: License
                - 'select class="rvn-filter-select" disabled aria-label="License"':
                    - option: Any license
                    - option: Free for commercial use
                    - option: Attribution required
            - fieldset class="rvn-filter-group":
                - legend: Tags
                - rtgl-view class="rvn-chip-row":
                    - span class="rvn-chip": Fantasy
