---
template: creator
title: RouteVN Creator - Create Visual Novels without any coding
disableFooterSpacer: true
seo:
  title: RouteVN Creator - Create Visual Novels without any coding
  description: Free and Open Source tool to create Visual Novels without any coding. Live preview, asset manager, layout editor. Fast, intuitive, reliable. Join our Discord server to stay updated.
  keywords: visual novel creator, VN creation tool, browser-based visual novel editor, no-code visual novel, visual novel maker, RouteVN Creator
  ogImage: https://routevn.com/public/images/routevn-illustration-og.png
  ogImageWidth: 1200
  ogImageHeight: 630
  ogImageAlt: RouteVN Creator social preview with Makkuro and creative tools
  ogImageType: image/png
---
- $partial: cursor-sparkles

- $partial: hero1
  title: ${site.creator.about.hero.title}
  subtitle: ${site.creator.about.hero.subtitle}
  subtitleHtml: ${site.creator.about.hero.subtitleHtml}
  message: ${site.creator.about.hero.message}
  backgroundImageSrc: /public/creator/chibi-hi.png
  backgroundImageAlt: Chibi character in a hi pose.
  videoSrc: ${site.creator.about.hero.videoSrc}
  posterSrc: ${site.creator.about.hero.posterSrc}

- style: |
    rtgl-view.rvn-creator-hero[w="f"] {
      box-sizing: border-box;
      max-width: 1200px !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
      width: 1200px !important;
    }

    .rvn-about-live-editor-section > rtgl-view[w="1200"] {
      box-sizing: border-box;
      max-width: 1200px;
      width: 1200px !important;
    }

    @media (min-width: 761px) {
      rtgl-view.rvn-creator-hero[w="f"] .rvn-creator-hero-chibi {
        left: 0;
      }
    }

    @media (max-width: 1280px) {
      rtgl-view.rvn-creator-hero[w="f"],
      .rvn-about-live-editor-section > rtgl-view[w="1200"] {
        max-width: calc(100vw - 64px) !important;
        width: calc(100vw - 64px) !important;
      }
    }

    @media (max-width: 760px) {
      rtgl-view.rvn-creator-hero[w="f"],
      .rvn-about-live-editor-section > rtgl-view[w="1200"] {
        max-width: calc(100vw - 48px) !important;
        width: calc(100vw - 48px) !important;
      }
    }

- $partial: feature-showcase
  title: ${site.creator.about.showcaseFeature.title}
  message: ${site.creator.about.showcaseFeature.message}
  backgroundColor: ${site.creator.about.showcaseFeature.backgroundColor}
  foregroundColor: ${site.creator.about.showcaseFeature.foregroundColor}
  themeClass: dark rvn-about-live-editor-section
  features: ${site.creator.about.showcaseFeature.features}
  sideImageSrc: ${site.creator.about.showcaseFeature.sideImageSrc}
  imgSrc: ${site.creator.about.showcaseFeature.imgSrc}
  videoSrc: ${site.creator.about.showcaseFeature.videoSrc}
  learnMoreHref: ${site.creator.about.showcaseFeature.learnMoreHref}
  learnMoreLabel: ${site.creator.about.showcaseFeature.learnMoreLabel}

# Temporarily hidden. Restore this block to show "Made with RouteVN Creator".
