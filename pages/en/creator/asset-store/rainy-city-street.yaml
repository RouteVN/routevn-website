- script: |
    (() => {
      document.querySelectorAll(".rvn-pack-card").forEach((card) => {
        const video = card.querySelector(".rvn-pack-card-video");

        if (!video) {
          return;
        }

        let loopTimer;

        const playVideo = () => {
          const playPromise = video.play();

          if (playPromise) {
            playPromise.catch(() => {});
          }
        };

        video.addEventListener("ended", () => {
          loopTimer = window.setTimeout(() => {
            video.currentTime = 0;
            playVideo();
          }, 500);
        });

        window.clearTimeout(loopTimer);
        playVideo();
      });

      const button = document.getElementById("rvn-add-pack-button");

      if (!button) {
        return;
      }

      const getPackJsonUrl = () => {
        const url = new URL(window.location.href);
        url.pathname = url.pathname.replace(/\/+$/, "") + ".json";
        url.search = "";
        url.hash = "";
        return url.href;
      };

      const copyText = async (text) => {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }

        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.append(textarea);
        textarea.select();
        const copied = document.execCommand("copy");
        textarea.remove();

        if (!copied) {
          throw new Error("Copy command failed");
        }
      };

      button.addEventListener("click", async () => {
        try {
          await copyText(getPackJsonUrl());
        } catch (error) {
          console.error("Failed to copy import URL", error);
        }
      });
    })();
