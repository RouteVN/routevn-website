- script: |
    (() => {
      document.querySelectorAll(".rvn-pack-card").forEach((card) => {
        const video = card.querySelector(".rvn-pack-card-video");

        if (!video) {
          return;
        }

        let loopTimer;

        const playVideo = () => {
          const playPromise = video.play();

          if (playPromise) {
            playPromise.catch(() => {});
          }
        };

        video.addEventListener("ended", () => {
          loopTimer = window.setTimeout(() => {
            video.currentTime = 0;
            playVideo();
          }, 500);
        });

        window.clearTimeout(loopTimer);
        playVideo();
      });

      const assetCards = document.querySelectorAll(".rvn-pack-card");
      const assetDialog = document.getElementById("rvn-asset-dialog");
      const assetDialogTitle = document.getElementById("rvn-asset-dialog-title");
      const assetDialogSubtitle = document.getElementById("rvn-asset-dialog-subtitle");
      const assetDialogFormat = document.getElementById("rvn-asset-dialog-format");
      const assetDialogVideo = document.getElementById("rvn-asset-dialog-video");
      const assetDialogImage = document.getElementById("rvn-asset-dialog-image");
      let activeAssetCard;
      let assetDialogLoopTimer;

      const playAssetDialogVideo = () => {
        if (!assetDialogVideo || assetDialogVideo.hidden) {
          return;
        }

        const playPromise = assetDialogVideo.play();

        if (playPromise) {
          playPromise.catch(() => {});
        }
      };

      const openAssetDialog = (card) => {
        if (!assetDialog) {
          return;
        }

        const cardTitle = card.querySelector(".rvn-pack-card-title")?.textContent?.trim() || "Asset";
        const cardMedia = card.querySelector(".rvn-pack-card-video, .rvn-pack-card-image");
        const mediaSrc = cardMedia?.getAttribute("src") || "";

        activeAssetCard = card;
        assetDialogTitle.textContent = cardTitle;
        assetDialogSubtitle.textContent = card.dataset.assetSubtitle || "";
        assetDialogFormat.textContent = card.dataset.assetFormat || "";

        window.clearTimeout(assetDialogLoopTimer);

        if (cardMedia instanceof HTMLVideoElement) {
          assetDialogImage.hidden = true;
          assetDialogVideo.hidden = false;
          assetDialogVideo.src = mediaSrc;
          assetDialogVideo.load();
        } else {
          assetDialogVideo.pause();
          assetDialogVideo.removeAttribute("src");
          assetDialogVideo.load();
          assetDialogVideo.hidden = true;
          assetDialogImage.src = mediaSrc;
          assetDialogImage.alt = `${cardTitle} preview`;
          assetDialogImage.hidden = false;
        }

        assetDialog.setAttribute("open", "");
        assetDialog.dialog?.setAttribute("aria-labelledby", "rvn-asset-dialog-title");
        assetDialog.dialog?.setAttribute("aria-describedby", "rvn-asset-dialog-subtitle");
        playAssetDialogVideo();
      };

      const closeAssetDialog = () => {
        if (!assetDialog) {
          return;
        }

        assetDialog.removeAttribute("open");
        window.clearTimeout(assetDialogLoopTimer);

        if (assetDialogVideo) {
          assetDialogVideo.pause();
          assetDialogVideo.removeAttribute("src");
          assetDialogVideo.load();
          assetDialogVideo.hidden = true;
        }

        activeAssetCard?.focus();
        activeAssetCard = null;
      };

      assetCards.forEach((card) => {
        card.addEventListener("click", () => {
          openAssetDialog(card);
        });
      });

      assetDialog?.addEventListener("close", closeAssetDialog);

      assetDialogVideo?.addEventListener("ended", () => {
        assetDialogLoopTimer = window.setTimeout(() => {
          assetDialogVideo.currentTime = 0;
          playAssetDialogVideo();
        }, Number(assetDialogVideo.dataset.loopDelay));
      });

      const button = document.getElementById("rvn-add-pack-button");

      if (!button) {
        return;
      }

      const getPackJsonUrl = () => {
        const url = new URL(window.location.href);
        url.pathname = url.pathname.replace(/\/+$/, "") + ".json";
        url.search = "";
        url.hash = "";
        return url.href;
      };

      const copyText = async (text) => {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }

        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.append(textarea);
        textarea.select();
        const copied = document.execCommand("copy");
        textarea.remove();

        if (!copied) {
          throw new Error("Copy command failed");
        }
      };

      button.addEventListener("click", async () => {
        try {
          await copyText(getPackJsonUrl());
        } catch (error) {
          console.error("Failed to copy import URL", error);
        }
      });
    })();
