---
template: creator
title: Transitions - RouteVN Creator Asset Store
disableFooterSpacer: true
seo:
  title: Transitions - RouteVN Creator Asset Store
  description: Browse the assets included in the Transitions pack for RouteVN Creator.
---
- style: |
    .rvn-pack-page {
      --rvn-pack-panel: #1f1f1f;
      --rvn-pack-border: rgba(255, 255, 255, 0.12);
      --rvn-pack-muted: rgba(255, 255, 255, 0.68);
      box-sizing: border-box;
      display: grid;
      gap: 24px;
      margin: 56px auto 0;
      max-width: 1200px;
      width: 1200px !important;
    }

    .rvn-pack-page *,
    .rvn-pack-page *::before,
    .rvn-pack-page *::after {
      box-sizing: border-box;
    }

    .rvn-pack-back {
      color: var(--rvn-pack-muted);
      font-size: 0.92rem;
      text-decoration: none;
      width: fit-content;
    }

    .rvn-pack-back:hover {
      color: var(--foreground);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .rvn-pack-header {
      align-items: end;
      display: flex;
      gap: 16px;
      justify-content: space-between;
      min-width: 0;
      width: 100% !important;
    }

    .rvn-pack-title {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.1;
      margin: 0;
    }

    .rvn-pack-subtitle,
    .rvn-pack-muted {
      color: var(--rvn-pack-muted);
    }

    .rvn-pack-subtitle {
      line-height: 1.5;
      max-width: none;
    }

    .rvn-pack-summary {
      align-items: start;
      background: transparent;
      border: 0;
      border-radius: 0;
      display: grid;
      gap: 18px;
      grid-template-columns: minmax(0, 1fr) 280px;
      overflow: visible;
      padding: 0;
    }

    .rvn-pack-preview {
      aspect-ratio: 16 / 9;
      background: #111;
      border: 1px solid var(--rvn-pack-border);
      border-radius: 8px;
      overflow: hidden;
      width: 100%;
    }

    .rvn-pack-preview-column {
      align-content: start;
      display: grid;
      gap: 10px;
      min-width: 0;
      width: 100%;
    }

    .rvn-pack-preview-video,
    .rvn-pack-preview-image,
    .rvn-pack-card-video,
    .rvn-pack-card-image {
      display: block;
      filter: saturate(0.95) var(--thumb-filter, none);
      height: 100%;
      object-fit: cover;
      transform: scale(1.01);
      width: 100%;
    }

    .rvn-pack-overview {
      align-self: start;
      align-content: start;
      display: grid;
      gap: 16px;
      padding: 0;
      position: sticky;
      top: 88px;
      width: 100% !important;
    }

    .rvn-pack-section-title {
      color: var(--foreground);
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
      margin: 0;
    }

    .rvn-pack-meta-list {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
      margin: 0;
      padding: 0;
      width: 100% !important;
    }

    .rvn-pack-meta-item {
      border-top: 1px solid var(--rvn-pack-border);
      display: grid;
      gap: 4px;
      min-width: 0;
      padding-top: 12px;
    }

    .rvn-pack-meta-item:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .rvn-pack-meta-label {
      color: var(--rvn-pack-muted);
      font-size: 0.78rem;
      line-height: 1.2;
    }

    .rvn-pack-meta-value {
      color: var(--foreground);
      font-size: 0.92rem;
      line-height: 1.3;
      margin: 0;
    }

    .rvn-pack-author {
      align-items: center;
      color: var(--foreground);
      display: flex;
      gap: 7px;
      text-decoration: none;
      width: fit-content;
    }

    .rvn-pack-author:hover span {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .rvn-pack-author-avatar {
      border-radius: 999px;
      display: block;
      height: 22px;
      object-fit: cover;
      width: 22px;
    }

    .rvn-pack-gallery-panel {
      background: transparent;
      border: 0;
      border-radius: 0;
      display: grid;
      gap: 32px;
      padding: 0;
    }

    .rvn-pack-asset-section {
      display: grid;
      gap: 18px;
    }

    .rvn-pack-subsection {
      display: grid;
      gap: 12px;
    }

    .rvn-pack-subsection-title {
      color: var(--rvn-pack-muted);
      font-size: 0.88rem;
      font-weight: 500;
      line-height: 1.3;
      margin: 0;
    }

    .rvn-pack-grid {
      width: 100% !important;
    }

    .rvn-pack-card {
      background: transparent;
      border: 1px solid var(--rvn-pack-border);
      border-radius: 8px;
      color: inherit;
      display: block;
      min-width: 0;
      overflow: hidden;
      text-decoration: none;
      transition: border-color 120ms ease, transform 120ms ease;
    }

    .rvn-pack-card:hover {
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .rvn-pack-card:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 3px;
    }

    .rvn-pack-card-thumb {
      aspect-ratio: 16 / 10;
      background: #111;
      display: block;
      overflow: hidden;
      width: 100%;
    }

    .rvn-pack-card-body {
      display: grid;
      gap: 7px;
      padding: 12px;
    }

    .rvn-pack-card-title {
      color: var(--foreground);
      font-weight: 400;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    @media (max-width: 1280px) {
      .rvn-pack-page {
        max-width: calc(100vw - 64px);
        width: calc(100vw - 64px) !important;
      }
    }

    @media (max-width: 980px) {
      .rvn-pack-summary {
        grid-template-columns: 1fr;
      }

      .rvn-pack-overview {
        position: static;
      }
    }

    @media (max-width: 760px) {
      .rvn-pack-page {
        max-width: calc(100vw - 48px);
        width: calc(100vw - 48px) !important;
      }

    }

    @media (max-width: 620px) {
      .rvn-pack-page {
        margin-top: 40px;
      }

      .rvn-pack-header {
        align-items: start;
        flex-direction: column;
      }
    }

