                            - 'video class="rvn-detail-thumb-video" src="/public/creator/asset-store/placeholder-thumbnail.webm" autoplay muted loop playsinline preload="metadata"':
                        - 'rtgl-view class="rvn-detail-thumb" role="listitem" style="--thumb-filter: hue-rotate(262deg) saturate(0.85);"':
                            - 'video class="rvn-detail-thumb-video" src="/public/creator/asset-store/placeholder-thumbnail.webm" autoplay muted loop playsinline preload="metadata"':
                        - 'rtgl-view class="rvn-detail-thumb" role="listitem" style="--thumb-filter: hue-rotate(24deg) saturate(1.1);"':
                            - 'video class="rvn-detail-thumb-video" src="/public/creator/asset-store/placeholder-thumbnail.webm" autoplay muted loop playsinline preload="metadata"':
                        - 'rtgl-view class="rvn-detail-thumb" role="listitem" style="--thumb-filter: hue-rotate(138deg) saturate(0.85);"':
                            - 'video class="rvn-detail-thumb-video" src="/public/creator/asset-store/placeholder-thumbnail.webm" autoplay muted loop playsinline preload="metadata"':
            - rtgl-view class="rvn-detail-description":
                - rtgl-text class="rvn-detail-section-title" s="h4": Description
                - p class="rvn-detail-paragraph": This is placeholder copy for an asset detail page. It shows how users can inspect a larger preview, scan alternate gallery items, and read practical notes before adding an asset to a RouteVN Creator project.
                - p class="rvn-detail-paragraph": The final page can replace these mock entries with real screenshots, licensing terms, author notes, package contents, and version compatibility details.
