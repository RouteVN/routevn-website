---
- style: |
    .rvn-extension-download {
      box-sizing: border-box;
      max-width: 1024px;
      width: 100%;
    }

    .rvn-browser-download {
      display: block;
      width: 100%;
      color: inherit;
      text-decoration: none;
      border-radius: var(--border-radius-lg);
    }

    a.rvn-browser-download:hover > rtgl-view {
      background: var(--muted);
      border-color: var(--foreground);
    }

    .rvn-browser-download:focus-visible {
      outline: 2px solid var(--foreground);
      outline-offset: 4px;
    }

    .rvn-browser-download[aria-disabled="true"] {
      opacity: 0.6;
      cursor: not-allowed;
    }

- rtgl-view h="100":
- 'main class="rvn-extension-download"':
    - rtgl-view ah="c" g="lg" w="f":
        - 'rtgl-image wh="128" of="con" src="/public/masshiro/stickers/masshirook.png" alt="Masshiro making an OK hand gesture."':
        - 'h1 style="font-size: 2rem; text-align: center; margin: 0 0 8px;"': Download RouteVN Web Extractor
        - rtgl-text s="lg" c="mu" ta="c" mb="xl": Choose your browser to get the extension.
        - rtgl-grid cols="3" md-cols="1" g="lg" w="f":
            - $for browser in browsers:
                - $if browser.disabled:
                    - 'span class="rvn-browser-download" role="link" aria-disabled="true" aria-label="${browser.name}: ${browser.label}" tabindex="0"':
                        - rtgl-view w="f" h="240" p="lg" bw="xs" br="lg" bgc="su" ah="c" av="c" g="md":
                            - 'rtgl-svg svg="${browser.icon}" wh="64" f="pr-fg" aria-hidden="true"':
                            - 'rtgl-text s="h3" role="heading" aria-level="2" ta="c"': ${browser.name}
                            - rtgl-text s="md" c="mu" ta="c": ${browser.store}
                  $else:
                    - 'a class="rvn-browser-download" href="${browser.href}" aria-label="${browser.label}" target="_blank" rel="noopener noreferrer"':
                        - rtgl-view w="f" h="240" p="lg" bw="xs" br="lg" bgc="su" ah="c" av="c" g="md":
                            - 'rtgl-svg svg="${browser.icon}" wh="64" f="pr-fg" aria-hidden="true"':
                            - 'rtgl-text s="h3" role="heading" aria-level="2" ta="c"': ${browser.name}
                            - rtgl-text s="md" c="mu" ta="c": ${browser.store}
        - rtgl-view mt="xl" g="md" ah="c":
            - rtgl-text s="lg" ta="c": Need help installing the extension or a dictionary?
            - 'rtgl-button href="/en/web-extractor/docs/getting-started/" v="se"': Installation Guide
