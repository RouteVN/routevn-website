- style: |
    .rvn-long-nights-page {
      align-items: center;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      padding: clamp(80px, 11vw, 144px) 0 48px;
      position: relative;
      width: 100%;
    }

    .rvn-long-nights-page::before {
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.07), transparent 34%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 46%);
      content: "";
      inset: 0 calc(50% - 50vw);
      pointer-events: none;
      position: absolute;
      z-index: -1;
    }

    .rvn-long-nights-header {
      align-items: center;
      display: flex;
      flex-direction: column;
      max-width: 820px;
      text-align: center;
    }

    .rvn-long-nights-title {
      margin: 0;
      text-wrap: balance;
    }

    .rvn-long-nights-description {
      margin-top: 28px;
      max-width: 760px;
      text-wrap: pretty;
    }

    .rvn-long-nights-video {
      aspect-ratio: 16 / 9;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      box-sizing: border-box;
      margin-top: clamp(40px, 6vw, 64px);
      max-width: 1000px;
      overflow: hidden;
      position: relative;
      width: 100%;
    }

    .rvn-long-nights-video iframe {
      border: 0;
      display: block;
      height: 100%;
      inset: 0;
      position: absolute;
      width: 100%;
    }

    .rvn-long-nights-share {
      margin-top: clamp(48px, 7vw, 72px);
      max-width: 1000px;
      width: 100%;
    }

    .rvn-long-nights-share-title {
      font-size: 1.25rem;
      line-height: 1.4;
      margin: 0 0 16px;
      text-align: center;
    }

    .rvn-long-nights-links {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      width: 100%;
    }

    .rvn-long-nights-link {
      align-items: center;
      background: var(--secondary);
      border: 1px solid var(--border);
      border-radius: 9999px;
      box-sizing: border-box;
      color: var(--secondary-foreground);
      display: flex;
      font-size: 0.95rem;
      font-weight: 600;
      gap: 10px;
      justify-content: center;
      min-height: 48px;
      padding: 10px 18px;
      text-decoration: none;
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .rvn-long-nights-link:hover {
      background: var(--accent);
      border-color: var(--muted-foreground);
      text-decoration: none;
      transform: translateY(-2px);
    }

    .rvn-long-nights-link:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 3px;
    }

    .rvn-long-nights-credits {
      margin-top: 64px;
      max-width: 480px;
      width: 100%;
    }

    .rvn-long-nights-credits-title {
      margin-bottom: 16px;
    }

    .rvn-long-nights-credits-list {
      column-gap: 32px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      margin: 0;
      row-gap: 10px;
      width: 100%;
    }

    .rvn-long-nights-credit-role,
    .rvn-long-nights-credit-name {
      margin: 0;
    }

    .rvn-long-nights-credit-name {
      text-align: right;
    }

    @media (max-width: 760px) {
      .rvn-long-nights-links {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .rvn-long-nights-link {
        transition: none;
      }
    }

- 'main class="rvn-long-nights-page"':
    - 'header class="rvn-long-nights-header"':
        - 'h1 class="rvn-long-nights-title" style="text-align: center; margin: 0;"': Through the Long Nights
        - 'rtgl-text class="rvn-long-nights-description" s="lg" c="mu" ta="c"': A tribute to artists, writers, musicians, voice actors, developers, animators, and creators of all kinds who have spent endless nights working through uncertainty, setbacks, and doubt to bring their work into the world.
    - 'div class="rvn-long-nights-video"':
        - 'iframe src="https://www.youtube-nocookie.com/embed/kX2XSwo0aEA?rel=0" title="Through the Long Nights - RouteVN promo video" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen':
    - 'section class="rvn-long-nights-share" aria-labelledby="rvn-long-nights-share-title"':
        - 'h2 id="rvn-long-nights-share-title" class="rvn-long-nights-share-title"': See our social media posts
        - 'nav class="rvn-long-nights-links" aria-label="Through the Long Nights on social media"':
            - $for link in shareLinks:
                - 'a class="rvn-long-nights-link" href="${link.href}" target="_blank" rel="noopener noreferrer" aria-label="${link.label}"':
                    - 'rtgl-svg svg="${link.svg}" wh="20" aria-hidden="true"':
                    - span: ${link.name}
    - 'section class="rvn-long-nights-credits" aria-labelledby="rvn-long-nights-credits-title"':
        - 'rtgl-text id="rvn-long-nights-credits-title" class="rvn-long-nights-credits-title" s="lg" ta="c" role="heading" aria-level="2"': Credits
        - 'dl class="rvn-long-nights-credits-list"':
            - 'dt class="rvn-long-nights-credit-role"':
                - 'rtgl-text s="sm" c="mu"': Director
            - 'dd class="rvn-long-nights-credit-name"':
                - 'rtgl-text s="sm"': han4wluc
            - 'dt class="rvn-long-nights-credit-role"':
                - 'rtgl-text s="sm" c="mu"': Music
            - 'dd class="rvn-long-nights-credit-name"':
                - 'rtgl-text s="sm"':
                    - 'a href="https://www.ngiamteo.com/" target="_blank" rel="noopener noreferrer"': Ngiam Teo
            - 'dt class="rvn-long-nights-credit-role"':
                - 'rtgl-text s="sm" c="mu"': Character animation
            - 'dd class="rvn-long-nights-credit-name"':
                - 'rtgl-text s="sm"':
                    - 'a href="https://x.com/aiyuuno" target="_blank" rel="noopener noreferrer"': Aiyuuno
            - 'dt class="rvn-long-nights-credit-role"':
                - 'rtgl-text s="sm" c="mu"': "Background & Composition"
            - 'dd class="rvn-long-nights-credit-name"':
                - 'rtgl-text s="sm"':
                    - 'a href="https://www.instagram.com/ddeathofher/" target="_blank" rel="noopener noreferrer"': Sarah A.
