imports:
  partials:
    seo: https://cdn.jsdelivr.net/npm/@rettangoli/sitekit@1.0.8/sitekit/partials/seo.yaml
    mobile-nav: https://cdn.jsdelivr.net/npm/@rettangoli/sitekit@1.0.8/sitekit/partials/mobile-nav.yaml
    docs-sidebar: https://cdn.jsdelivr.net/npm/@rettangoli/sitekit@1.0.8/sitekit/partials/docs-sidebar.yaml

data:
  themeCssHref: /public/theme.css
  themeBodyClass: dark

markdownit:
  html: true
  linkify: true
  typographer: false
  shiki:
    enabled: true
    theme: slack-dark
  codePreview:
    enabled: true
    showSource: true
    theme: slack-dark
  headingAnchors:
    slugMode: ascii
    wrap: true
build:
  keepMarkdownFiles: true
