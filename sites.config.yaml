imports:
  templates:
    documentation: https://cdn.jsdelivr.net/npm/@rettangoli/sitekit@1.0.6/sitekit/templates/docs.yaml
  partials:
    seo: https://cdn.jsdelivr.net/npm/@rettangoli/sitekit@1.0.6/sitekit/partials/seo.yaml
    mobile-nav: https://cdn.jsdelivr.net/npm/@rettangoli/sitekit@1.0.6/sitekit/partials/mobile-nav.yaml
    docs-sidebar: https://cdn.jsdelivr.net/npm/@rettangoli/sitekit@1.0.6/sitekit/partials/docs-sidebar.yaml

markdownit:
  html: true
  linkify: true
  typographer: false
  shiki:
    enabled: true
    theme: slack-dark
  codePreview:
    enabled: true
    showSource: true
    theme: slack-dark
  headingAnchors:
    slugMode: ascii
    wrap: true
build:
  keepMarkdownFiles: false
